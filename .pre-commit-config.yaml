# Pre-commit hooks for the homelab repo. Formats files and scans for secrets
# before each commit; the same hooks run in CI (.github/workflows/lint.yml's
# pre-commit job) via `pre-commit run --all-files`, so local and CI can't drift.
#
# One-time local setup:
#   brew install pre-commit yamlfmt shfmt shellcheck yamllint betterleaks
#   git config --unset core.hooksPath   # drop the old .githooks gitleaks hook
#   pre-commit install
#
# Formatter/linter per file type:
#   Markdown  -> mdformat (+ mdformat-tables; aligns tables, CommonMark-strict so
#                it won't mangle snake_case prose or rewrite embedded code blocks)
#   YAML      -> yamlfmt (format, conservative — see .yamlfmt) + yamllint (lint)
#   Shell     -> shfmt (format) + shellcheck (lint, -S info)
#   Secrets   -> betterleaks (replaces gitleaks; #123)
#   All files -> whitespace / EOF / merge-conflict hygiene
#
# check-yaml is deliberately omitted — it can't parse the Authentik blueprints'
# custom !Env/!Find/!KeyOf tags. yamllint covers YAML validity instead.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files

  # Markdown: mdformat (managed env so the mdformat-tables plugin is isolated).
  # --wrap keep preserves source line wrapping; CommonMark-strict means
  # intraword underscores stay literal and fenced code blocks are left verbatim.
  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        # --wrap keep: preserve source line wrapping. --number: keep
        # consecutive ordered-list numbering (1. 2. 3.) rather than all-1.
        args: [--wrap, keep, --number]
        additional_dependencies:
          - mdformat-tables

  # Other formatters/linters run from the locally installed binaries
  # (language: system), matching what CI installs.
  - repo: local
    hooks:
      - id: yamlfmt
        name: yamlfmt (format YAML)
        entry: yamlfmt -conf .yamlfmt
        language: system
        files: \.ya?ml$
      - id: yamllint
        name: yamllint
        entry: yamllint -c .github/yamllint.yml
        language: system
        files: \.ya?ml$
      - id: shfmt
        name: shfmt (format shell)
        entry: shfmt -w -i 2 -ci -bn
        language: system
        types: [shell]
      - id: shellcheck
        name: shellcheck (-S info)
        entry: shellcheck -S info
        language: system
        types: [shell]

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.3.1
    hooks:
      - id: betterleaks
