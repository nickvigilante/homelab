# Gitleaks configuration. Extends the built-in default ruleset.
#
# Add allowlist entries below if the default rules produce false positives
# on something we know is safe (e.g. a public test fixture, a checksum that
# happens to look like a credential).
#
# Docs: https://github.com/gitleaks/gitleaks

[extend]
useDefault = true

[allowlist]
  description = "Documented placeholder strings (REPLACE_WITH_*) are obvious template stubs, not real secrets."
  regexTarget = "match"
  regexes = [
    '''REPLACE_WITH_[A-Z0-9_]+''',
  ]
