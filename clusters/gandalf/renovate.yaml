apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/renovate
  # Flux owns everything in this directory, so pruning is safe.
  prune: true
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The ExternalSecret needs ESO and the ClusterSecretStore (infrastructure),
  # and the PrometheusRule needs the CRD that kube-prometheus-stack installs (kps).
  dependsOn:
    - name: infrastructure
    - name: kps
