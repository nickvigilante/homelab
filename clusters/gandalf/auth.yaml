apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: auth
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/authentik
  # prune: false -- chart and supporting raw manifests are still
  # manually-managed. Flip on after full takeover.
  prune: false
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
