apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: syncstorage-rs
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/syncstorage-rs
  # Full Flux takeover -- see kustomization.yaml.
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
