apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/loki
  # Flux owns everything in k8s/loki.
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The Grafana this registers a datasource with belongs to kps.
  dependsOn:
    - name: kps
