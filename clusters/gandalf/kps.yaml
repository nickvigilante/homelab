apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kps
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/kube-prometheus-stack
  # prune: false -- the kube-prometheus-stack chart + PV/PVC + values
  # are still manually-managed. Flip on after full takeover.
  prune: false
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
