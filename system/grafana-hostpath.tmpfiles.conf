# systemd-tmpfiles drop-in for Grafana's hostPath data dir.
#
# Installed at /etc/tmpfiles.d/grafana-hostpath.conf by
# ansible/provision-gandalf.yml. systemd-tmpfiles --create runs this at every
# boot before k3s, so if /opt/grafana ever ends up missing (disk swap, fsck,
# errant rm) or misowned, it gets restored before kubelet would refuse to
# start the Grafana pod (the PV is type: Directory and won't auto-create).
#
# We pair this with `grafana.initChownData.enabled: false` in
# k8s/kube-prometheus-stack/values.yaml: the chart's chown-recursive
# initContainer is dropped because it CrashLoopBackOffs on every restart
# after Grafana creates 0700-mode report-export subdirs (it lacks
# DAC_OVERRIDE to traverse them). Provisioning the parent dir here + in the
# Ansible task makes that initContainer redundant.
#
# Type 'd' creates the dir if missing and adjusts mode/ownership to match.
# It does NOT recurse into subdirs (we don't want to touch Grafana's
# pdf/csv/png internal layout).
#
# Grafana runs as uid 472 inside the container; the host needs to give the
# kubelet a 0755 dir owned by 472:472 so that uid can write through the
# hostPath mount.
d /opt/grafana 0755 472 472 -
