# Drop-in for sshd_config — pubkey auth only.
#
# /etc/ssh/sshd_config.d/*.conf files are merged on top of the main
# sshd_config, so this is non-destructive: distro defaults stay
# intact, we only override the two prompt-auth knobs.
#
# Managed by ansible/provision-gandalf.yml + ansible/provision-pi.yml.
# Edit this file (not the rendered /etc copy) and re-run the playbook.
#
# Why both keys: Ubuntu 24.04+ ships sshd with KbdInteractive on by
# default. Disabling only PasswordAuthentication still lets PAM
# prompt-based auth through. Belt + suspenders.
PasswordAuthentication no
KbdInteractiveAuthentication no
