# Drop-in for sshd_config — pubkey auth only.
#
# /etc/ssh/sshd_config.d/*.conf files are merged on top of the main
# sshd_config, so this is non-destructive: distro defaults stay
# intact, we only override the two prompt-auth knobs.
#
# Managed by ansible/provision-gandalf.yml + ansible/provision-pi.yml.
# Edit this file (not the rendered /etc copy) and re-run the playbook.
#
# Why both keys: Ubuntu 24.04+ ships sshd with KbdInteractive on by
# default. Disabling only PasswordAuthentication still lets PAM
# prompt-based auth through. Belt + suspenders.
PasswordAuthentication no
KbdInteractiveAuthentication no

# Exempt trusted sources from OpenSSH 9.8+ PerSourcePenalties (on by
# default in the OpenSSH 10.x that ships with Ubuntu 26.04). The penalty
# box exists to throttle password brute-force — a threat that cannot
# exist here, since auth is pubkey-only (above). Left at the default it
# misfires on the LAN: a client that opens connections which disconnect
# before authenticating (e.g. an IDE Remote-SSH / ControlMaster
# reconnect burst) trips a ~16s per-source penalty, and every retry
# re-arms it — surfacing as intermittent
# "kex_exchange_identification: Connection reset by peer" that clears on
# retry. Exempt the LAN + tailnet (both authenticated, trusted paths) so
# penalties only ever apply to unexpected sources. Also exempt the k3s
# pod CIDR: Uptime Kuma's "gandalf SSH" port monitor connects from its
# pod IP every 60s, and without this that in-cluster traffic reads as
# an unexempted source just like the LAN case above — it tripped the
# same penalty and blacked out the monitor for ~14 minutes on
# 2026-09-27.
PerSourcePenaltyExemptList 192.168.50.0/24,100.64.0.0/10,10.42.0.0/16
