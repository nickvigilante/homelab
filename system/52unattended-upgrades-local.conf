// Local overrides for unattended-upgrades. Edited by hand.
// This file is read after 50unattended-upgrades and overrides any
// settings there, so it survives package upgrades / dpkg-reconfigure.

// Reboot automatically after security upgrades that need it (kernel,
// libc). k3s comes back up on its own; brief cluster downtime is
// acceptable for a single-node home lab.
Unattended-Upgrade::Automatic-Reboot "true";

// Reboot even if a user is logged in (this is a server, not a desktop).
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";

// Reboot window: 08:00 in the host's local timezone, which is
// America/New_York (the Ansible provision playbooks set it). This value is
// parsed in the local system timezone, so it follows EST/EDT on its own.
// 08:00 sits after every scheduled job: the 03:00 restic backup, the Sunday
// 04:00 forget+prune and 05:00 verify (which can overrun past 05:00), the
// daily 06:00 requesty-sync and the daily 07:00 Renovate run. A
// freshly-completed snapshot always exists before a possibly-flaky reboot.
Unattended-Upgrade::Automatic-Reboot-Time "08:00";
