// Local overrides for unattended-upgrades. Edited by hand.
// This file is read after 50unattended-upgrades and overrides any
// settings there, so it survives package upgrades / dpkg-reconfigure.

// Reboot automatically after security upgrades that need it (kernel,
// libc). k3s comes back up on its own; brief cluster downtime is
// acceptable for a single-node home lab.
Unattended-Upgrade::Automatic-Reboot "true";

// Reboot even if a user is logged in (this is a server, not a desktop).
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";

// Reboot window: 10:00 UTC. Host timezone is UTC; this value is
// parsed in the local system timezone. 10:00 UTC = 06:00 ET (EDT) /
// 05:00 ET (EST), which sits *after* the 03:00 ET restic backup
// (07:00/08:00 UTC) and the Sunday 04:00 ET forget+prune
// (08:00/09:00 UTC), so a freshly-completed snapshot always exists
// before a possibly-flaky reboot.
Unattended-Upgrade::Automatic-Reboot-Time "10:00";
