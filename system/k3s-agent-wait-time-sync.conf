# Drop-in for k3s-agent.service — don't start until the clock is synced.
#
# The Pis have no battery-backed RTC, so they boot with a stale saved
# time. On 2026-09-27 samwise booted at Jul 27 and k3s-agent started 12s
# before chrony stepped the clock forward 62 days. Containers being
# created at that moment were left with name reservations that were
# never released, and the kubelet retried them forever
# (CreateContainerError: "failed to reserve container name").
#
# time-sync.target only waits for a real sync when chrony-wait.service
# is enabled (provision-pi.yml does that).
# If chrony can't sync, chrony-wait times out and k3s starts anyway
# (Wants=, not Requires=), so an NTP outage degrades to a delay.
#
# Installed to /etc/systemd/system/k3s-agent.service.d/10-wait-time-sync.conf
# by ansible/provision-pi.yml.
[Unit]
Wants=time-sync.target
After=time-sync.target
