# Raise the per-UID inotify instance limit from the default 128 to 1024.
#
# The limit is per UID, and most pods on gandalf run as root, so they all
# share root's budget with k3s, systemd, and one containerd shim per pod
# (about 3 instances each).
# As pods were added the budget ran out (2026-10-07), and Jellyfin
# crash-looped at startup with "The configured user limit (128) on the
# number of inotify instances has been reached".
#
# Instances are cheap (kernel memory is only used once watches are added),
# and max_user_watches is already ~250k, so the new ceiling costs nothing
# until used.
#
# Managed by ansible/provision-gandalf.yml.
fs.inotify.max_user_instances = 1024
