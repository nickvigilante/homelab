# Override for k3s's bundled Traefik chart. Deployed by Ansible to
# /var/lib/rancher/k3s/server/manifests/traefik-config.yaml; k3s's
# HelmChart controller reads anything in that dir and merges it onto
# the default chart values, then re-renders the release.
#
# Why hostNetwork + ClusterIP service — the previous strategy
# (`externalTrafficPolicy: Local` on the default LoadBalancer Service)
# didn't deliver real client IPs because k3s's bundled klipper-lb
# (v0.4.x) always MASQUERADEs the source IP at the svclb pod's
# POSTROUTING, regardless of `externalTrafficPolicy`. Switch to
# `hostNetwork: true` (Traefik binds gandalf:80/443 directly, bypassing
# the svclb DaemonSet) plus `service.type: ClusterIP` (so the k3s
# svccontroller stops creating svclb pods for the Traefik Service,
# which would otherwise contend for the same host ports). External
# clients' source IPs land on Traefik unchanged. Closes Tier-1
# Authentik audit finding 6-i.
#
# Why nodeSelector: gandalf — with hostNetwork, the pod must run on
# the same node DNS points to (gandalf, per Pi-hole's wildcard
# `*.vigihome.net` record). Pinning makes that explicit and renders
# audit finding 6-iii's concern (Traefik placement drift on a
# multi-node cluster) moot.
#
# Privileged ports — Traefik binds 80/443 directly under hostNetwork.
# The chart runs Traefik as uid 65532 (non-root); the cap-based
# approach (NET_BIND_SERVICE in container securityContext) doesn't
# work because Linux requires file caps or ambient caps for non-root
# uids to USE the cap. Sidestep with a host sysctl
# (system/99-unprivileged-ports.conf) that sets
# net.ipv4.ip_unprivileged_port_start = 0, allowing any user to bind
# any port. The chart's default container securityContext
# (drop:[ALL], readOnlyRootFilesystem:true, etc.) is preserved
# unchanged — we don't override securityContext here.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    nodeSelector:
      kubernetes.io/hostname: gandalf
    hostNetwork: true
    service:
      type: ClusterIP
    # Bind Traefik directly to 80/443 (chart default is 8000/8443).
    # The host sysctl ip_unprivileged_port_start=0 makes these bindable
    # by the chart's default uid 65532. See top-of-file rationale.
    ports:
      web:
        port: 80
        exposedPort: 80
      websecure:
        port: 443
        exposedPort: 443
    # Default middleware on the websecure entryPoint: every HTTPS request
    # passes through strip-auth-headers before reaching any backend. Closes
    # Tier-1 Authentik audit finding 6-ii. The middleware itself lives at
    # system/traefik-strip-auth-headers-middleware.yaml (kube-system ns).
    # Traefik refers to k8s-CRD middlewares as <namespace>-<name>@kubernetescrd.
    additionalArguments:
      - --entryPoints.websecure.http.middlewares=kube-system-strip-auth-headers@kubernetescrd
