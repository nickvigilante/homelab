# Allow non-root processes to bind to privileged ports (<1024).
# Lowers the unprivileged port boundary from the default 1024 to 0.
#
# Required for the Traefik pod running with hostNetwork: true: Traefik
# binds gandalf:80/443 directly, but the container runs as uid 65532
# (the chart default, non-root). The container's capability set has
# CAP_NET_BIND_SERVICE available, but Linux only puts caps in the
# Permitted set for non-root processes — for the cap to actually take
# effect at bind() time, it must also be in the Effective set, which
# requires either file capabilities on the binary or ambient
# capabilities. Neither is practical in the chart's stock image;
# lowering ip_unprivileged_port_start sidesteps the cap dance entirely.
#
# Trade-off: any process on gandalf (not just Traefik) can now bind
# 80/443. Acceptable on a single-purpose homelab control-plane node
# where the only process binding low ports is intentionally Traefik.
# Revisit if gandalf ever runs untrusted multi-tenant workloads.
#
# Managed by ansible/provision-gandalf.yml.
net.ipv4.ip_unprivileged_port_start = 0
