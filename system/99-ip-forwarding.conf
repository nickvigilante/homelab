# Enable IPv4 + IPv6 packet forwarding.
#
# Required for:
#   - Tailscale exit-node mode on gandalf (forwards tailnet member
#     traffic to the home WAN). Tailscale's admin UI flags
#     "IP forwarding disabled" if these aren't both 1.
#   - Future subnet-routing if gandalf ever advertises 192.168.50.0/24
#     to the tailnet (alternative to exit-node for one-off LAN access).
#
# IPv4 forwarding was already on (probably set by an earlier service or
# the k3s install path); this file ensures it stays on across reboots
# and adds the IPv6 counterpart that was previously off.
#
# Managed by ansible/provision-gandalf.yml.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
