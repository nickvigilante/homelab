# Provision a Raspberry Pi as a k3s agent + Tailscale node.
#
# Usage:
#
#   # 1. Mint a Tailscale auth key in the admin UI
#   #      https://login.tailscale.com/admin/settings/keys
#   #    Pre-authorized, single-use, tag:homelab, ~1h expiry.
#   #    Save to ~/.tailscale-authkey (chmod 600).
#
#   # 2. With Pi Imager Advanced Options, the freshly imaged Pi
#   #    already has the `nickv` user + your SSH pubkey on first
#   #    boot. No `ansible_user=pi --ask-pass` dance needed.
#
#   ansible-playbook provision-pi.yml \
#     --limit <pi-hostname> \
#     --ask-become-pass \
#     --extra-vars "tailscale_authkey=$(cat ~/.tailscale-authkey)"
#
# --ask-become-pass (-K) is required: the k3s join token is slurped
# from gandalf via `delegate_to`, and the file is root-only on
# gandalf. The same prompt also covers `become: true` for the
# pi-side tasks (apt, systemd, etc.) — Ansible caches the password
# across hosts in the play, and `nickv` is the operator on every
# host, so one prompt does both.

- name: Provision Pi as k3s agent + Tailscale node
  hosts: cluster_agents
  become: true

  vars:
    # Pre-flight check: the operator must pass tailscale_authkey via
    # --extra-vars. Defaulting to empty so the assert below fires
    # with a clear message instead of an opaque tailscale CLI error.
    tailscale_authkey: ""

  pre_tasks:
    - name: Require tailscale_authkey
      ansible.builtin.assert:
        that:
          - tailscale_authkey | length > 0
        fail_msg: >
          Set tailscale_authkey via --extra-vars. Generate a one-time
          pre-authorized key tagged tag:homelab at
          https://login.tailscale.com/admin/settings/keys.

    # Read the k3s join token from gandalf via delegate_to so the
    # operator can `--limit <pi>` without also listing gandalf in
    # the limit. `become: true` from the play applies to the
    # delegated host (gandalf), where the token file is root-owned.
    # Re-slurping once per pi when --limit covers multiple hosts is
    # harmless — the token is identical across runs.
    - name: Slurp k3s node-token from gandalf
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_slurped
      delegate_to: gandalf

    - name: Stash decoded k3s_token for downstream tasks
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_slurped.content | b64decode | trim }}"
        cacheable: false

  tasks:
    # ---- Base system ----------------------------------------------------

    - name: Set hostname to the inventory name
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Ensure /etc/hosts has the new hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1 {{ inventory_hostname }}"
        state: present

    - name: Set timezone to America/New_York
      community.general.timezone:
        name: America/New_York

    - name: Install baseline packages
      ansible.builtin.apt:
        name:
          - curl
          - htop
          - jq
          - vim
          - unattended-upgrades
        state: present
        update_cache: true
        cache_valid_time: 3600
        # Stale-image first boot can spend several minutes inside
        # apt-daily / unattended-upgrades catching up; default 60s
        # isn't enough. 10 min is generous but still bounded.
        lock_timeout: 600

    # Reuses the same unattended-upgrades drop-in shipped for gandalf.
    # See ../system/52unattended-upgrades-local.conf for the source.
    - name: Install auto-reboot drop-in for unattended-upgrades
      ansible.builtin.copy:
        src: ../system/52unattended-upgrades-local.conf
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local.conf
        owner: root
        group: root
        mode: "0644"

    # ---- SSH pubkey-only ------------------------------------------------
    #
    # Same drop-in shipped for gandalf — disables password + keyboard-
    # interactive auth via /etc/ssh/sshd_config.d/. Was applied manually
    # on samwise 2026-05-14; this task captures the drift so future
    # Pis come up pubkey-only from first provision.
    - name: Install sshd drop-in (pubkey-only)
      ansible.builtin.copy:
        src: ../system/99-no-passwords.conf
        dest: /etc/ssh/sshd_config.d/99-no-passwords.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload sshd

    # ---- Tailscale ------------------------------------------------------

    - name: Add Tailscale apt signing key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Add Tailscale apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/tailscale.list
        content: |
          deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu noble main
        mode: "0644"

    - name: Install tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true
        # See "Install baseline packages" above — first boot's
        # apt-daily can hold the dpkg lock for minutes.
        lock_timeout: 600

    - name: Bring up Tailscale with the tag:homelab tag
      ansible.builtin.command:
        cmd: >
          tailscale up
          --authkey={{ tailscale_authkey }}
          --advertise-tags=tag:homelab
          --hostname={{ inventory_hostname }}
          --accept-dns=true
      register: tailscale_up
      changed_when: "'Success.' in tailscale_up.stdout or tailscale_up.stdout == ''"
      # If already authed, tailscale up is idempotent; suppress error noise.
      failed_when:
        - tailscale_up.rc != 0
        - "'already authenticated' not in tailscale_up.stderr | default('')"

    # ---- k3s agent ------------------------------------------------------

    # k3s install script is idempotent — re-runs are safe and pick up
    # config changes. INSTALL_K3S_VERSION pinning is intentionally left
    # to the env (or omitted to track stable) so gandalf and agents
    # don't drift unintentionally; bump centrally when you upgrade.
    - name: Install k3s agent
      ansible.builtin.shell:
        cmd: |
          curl -sfL https://get.k3s.io | \
            K3S_URL={{ k3s_url | quote }} \
            K3S_TOKEN={{ k3s_token | quote }} \
            INSTALL_K3S_EXEC="agent" \
            sh -
        creates: /usr/local/bin/k3s

    - name: Ensure k3s-agent service is enabled and started
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started

    - name: Apply node labels
      ansible.builtin.command:
        cmd: >
          kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml label node {{ inventory_hostname }}
          {% for key, value in k3s_node_labels.items() %}
          {{ key }}={{ value }}
          {% endfor %}
          --overwrite
      when: k3s_node_labels | length > 0
      delegate_to: gandalf
      # kubectl on gandalf needs the kubeconfig (root-only by default).
      become: true
      changed_when: false

  handlers:
    - name: Reload sshd
      ansible.builtin.systemd:
        name: ssh
        state: reloaded
