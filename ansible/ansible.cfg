[defaults]
inventory = inventory.yml
host_key_checking = False
retry_files_enabled = False
# Use the built-in default callback with YAML-formatted task results.
# The old `stdout_callback = yaml` resolved to community.general.yaml,
# which was removed in community.general 12.0.0 (shipped with the
# ansible 11.x / 13.x metapackages). The replacement per Ansible's
# migration guide is `result_format = yaml` on the default callback.
stdout_callback = default
result_format = yaml
roles_path = roles
collections_path = collections

# Don't auto-create __pycache__ next to the playbook
local_tmp = ~/.ansible/tmp
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/fact_cache
fact_caching_timeout = 3600

[ssh_connection]
# Pipelining is intentionally OFF. With pipelining=True, Ansible sends
# the module payload over stdin, which leaves no stdin available for
# sudo to prompt on. The result is the hardcoded 12s
# "Timeout waiting for privilege escalation prompt" error. Pipelining
# is only safe when sudo is passwordless on the target. SSH multiplexing
# via control_path below still gives us most of the speed-up.
pipelining = False
control_path = ~/.ssh/ansible-%%h-%%p-%%r
