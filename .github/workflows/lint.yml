name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Runs the exact same hooks as the local pre-commit setup
  # (.pre-commit-config.yaml) so local and CI can't drift — formatters
  # (prettier/yamlfmt/shfmt), linters (yamllint/shellcheck), and the
  # betterleaks secret scan. Fails if any hook would modify a committed file.
  pre-commit:
    name: pre-commit (format + lint + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - uses: actions/setup-node@v4
      - name: Install the tools the repo:local hooks call (match the local brew set)
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y shellcheck
          npm install -g prettier@3
          go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          pip install yamllint==1.35.1 pre-commit
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure

  kubeconform:
    name: kubeconform (raw manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Validate raw manifests
        # Includes every standalone raw manifest in k8s/. Excludes Helm
        # values files (anything matching `*values.yaml`) and the
        # ansible/ tree (Ansible YAML, not k8s manifests). When a new
        # service uses a filename that isn't in this list, add it
        # rather than letting it silently bypass the CI check.
        run: |
          set -euo pipefail
          find k8s -type f \( \
              -name namespace.yaml \
              -o -name pv-pvc.yaml \
              -o -name secret.example.yaml \
              -o -name deployment.yaml \
              -o -name '*-job.yaml' \
              -o -name '*-cronjob.yaml' \
              -o -name 'clusterissuer-*.yaml' \
              -o -name certificate.yaml \
              -o -name 'ingress-*.yaml' \
              -o -name 'middleware-*.yaml' \
              -o -name 'netpol-*.yaml' \
              -o -name redis.yaml \
            \) -print0 \
            | xargs -0 kubeconform \
                -summary \
                -strict \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
