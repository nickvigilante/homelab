name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Runs the exact same hooks as the local pre-commit setup
  # (.pre-commit-config.yaml) so local and CI can't drift — formatters
  # (mdformat/yamlfmt/shfmt), linters (yamllint/shellcheck), and the
  # betterleaks secret scan. Fails if any hook would modify a committed file.
  # (mdformat + betterleaks + the hygiene hooks are managed by pre-commit
  # itself; only the language:system hooks below need tools on PATH.)
  pre-commit:
    name: pre-commit (format + lint + secrets)
    runs-on: ubuntu-latest
    env:
      # Single source of truth for the Go-built tools: feeds both the cache
      # key and `go install`, so a bump here rebuilds instead of restoring
      # a stale binary.
      YAMLFMT_VERSION: v0.21.0
      SHFMT_VERSION: v3.13.1
      # Release asset betterleaks_<version>_linux_x64.tar.gz, checked against
      # this sha256 (from the release's published digest and checksums.txt).
      BETTERLEAKS_VERSION: 1.3.1
      BETTERLEAKS_SHA256: 7b241c80204538cbb210c94514dc7cdff86430938bd7d5b6e289207959530849
    steps:
      # Full history: the PR secret scan below needs origin/<base> and the PR's
      # commits, not only the merged tree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
      # yamlfmt and shfmt are compiled from source by `go install`, which
      # dominates the setup time -- cache the built binaries instead.
      - name: Cache yamlfmt and shfmt
        id: go-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-yamlfmt-${{ env.YAMLFMT_VERSION }}-shfmt-${{ env.SHFMT_VERSION }}
      - name: Build yamlfmt and shfmt (cache miss only)
        if: steps.go-tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          go install "github.com/google/yamlfmt/cmd/yamlfmt@${YAMLFMT_VERSION}"
          go install "mvdan.cc/sh/v3/cmd/shfmt@${SHFMT_VERSION}"
      - name: Install the other tools the repo:local hooks call
        run: |
          set -euo pipefail
          # ubuntu-latest normally ships shellcheck; only pay for apt if not.
          command -v shellcheck >/dev/null \
            || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          pip install yamllint==1.35.1 pre-commit
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # pre-commit builds a venv per hook repo (mdformat + its plugin, the
      # hygiene hooks) and compiles betterleaks. Keyed on the config, so any
      # hook `rev` or additional_dependencies change rebuilds them. The
      # interpreter hash guards against restoring venvs built by an older
      # runner Python.
      - name: Fingerprint the Python interpreter
        id: py
        run: echo "hash=$(python -VV | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ steps.py.outputs.hash }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # The betterleaks hook scans staged changes only, so under `pre-commit
      # run --all-files` on a clean checkout it scans nothing. The steps below
      # are the real secret scan. The release tarball is cached and its sha256
      # is verified on every run, so a stale or tampered cache entry fails
      # loudly (a mismatching cached file is dropped and downloaded once more).
      - name: Cache betterleaks release
        uses: actions/cache@v4
        with:
          path: ~/.ci-tools/downloads
          key: betterleaks-${{ runner.os }}-${{ runner.arch }}-${{ env.BETTERLEAKS_VERSION }}
      - name: Install betterleaks ${{ env.BETTERLEAKS_VERSION }}
        run: |
          set -euo pipefail
          asset="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          downloads="$HOME/.ci-tools/downloads"
          bin="$HOME/.ci-tools/betterleaks"
          mkdir -p "$downloads" "$bin"
          if [ -f "$downloads/$asset" ] && ! echo "${BETTERLEAKS_SHA256}  ${downloads}/${asset}" | sha256sum -c --quiet -; then
            echo "cached ${asset} failed its checksum; downloading again"
            rm -f -- "${downloads:?}/${asset}"
          fi
          if [ ! -f "$downloads/$asset" ]; then
            curl -fsSL --retry 3 -o "$downloads/$asset" \
              "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${asset}"
          fi
          echo "${BETTERLEAKS_SHA256}  ${downloads}/${asset}" | sha256sum -c -
          tar -xzf "$downloads/$asset" -C "$bin" betterleaks
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/betterleaks" --version
      # Scans every file of the checkout (not just staged changes). -v prints
      # each finding's file, line and rule; --redact keeps the secret itself
      # out of this public log. Exits 1 when a leak is found.
      - name: Secret scan (betterleaks)
        run: betterleaks dir --no-banner --redact -v .
      # The tree scan above cannot see a secret that one commit of a PR adds and
      # a later commit removes. Scan the PR's commits too. The checkout is the
      # PR merged into the base branch, so origin/<base>..HEAD is exactly the
      # PR's commits (plus the synthetic merge commit). The base ref reaches the
      # script through env, never through ${{ }} in run.
      - name: Secret scan of PR history (betterleaks)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: betterleaks git --no-banner --redact -v --log-opts="origin/${BASE_REF}..HEAD" .
      - name: pre-commit run --all-files
        # betterleaks is skipped here only: its hook scans staged changes, so
        # on a clean checkout it scans nothing while still costing a Go build.
        # The "Secret scan (betterleaks)" steps above are the real scan.
        env:
          SKIP: betterleaks
        run: pre-commit run --all-files --show-diff-on-failure

  kubeconform:
    name: kubeconform (raw manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Validate raw manifests
        # Includes every standalone raw manifest in k8s/. Excludes Helm
        # values files (anything matching `*values.yaml`) and the
        # ansible/ tree (Ansible YAML, not k8s manifests). When a new
        # service uses a filename that isn't in this list, add it
        # rather than letting it silently bypass the CI check.
        run: |
          set -euo pipefail
          find k8s -type f \( \
              -name namespace.yaml \
              -o -name pv-pvc.yaml \
              -o -name secret.example.yaml \
              -o -name deployment.yaml \
              -o -name '*-job.yaml' \
              -o -name '*-cronjob.yaml' \
              -o -name 'clusterissuer-*.yaml' \
              -o -name certificate.yaml \
              -o -name 'ingress-*.yaml' \
              -o -name 'middleware-*.yaml' \
              -o -name 'netpol-*.yaml' \
              -o -name redis.yaml \
              -o -name helmrelease.yaml \
              -o -name external-secret.yaml \
              -o -name clustersecretstore.yaml \
              -o -name prometheusrule.yaml \
              -o -name podmonitor.yaml \
              -o -name '*-cert.yaml' \
              -o -name '*-issuer.yaml' \
            \) -print0 \
            | xargs -0 kubeconform \
                -summary \
                -strict \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  python-tests:
    name: pytest (requesty-coder-sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest
      - run: pytest -q
