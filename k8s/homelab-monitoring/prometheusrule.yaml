apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
spec:
  groups:
    - name: homelab
      rules:
        # The nightly restic CronJob (k8s/backup/backup-cronjob.yaml,
        # schedule "0 3 * * *") in the `backup` namespace. Alert on time since
        # last SUCCESS, not on job failure -- a single rule on
        # last_successful_time catches both "ran and failed" and "never ran".
        # 25h gives a 1h grace past the 24h cadence.
        - alert: ResticBackupStale
          expr: |
            (time() - max(kube_cronjob_status_last_successful_time{cronjob="restic-backup", namespace="backup"})) > 25 * 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Nightly restic backup has not succeeded in over 25h"
            description: "No successful restic-backup CronJob run in >25h. Check `kubectl -n backup get jobs` and the most recent job's logs."
        # kube_pod_container_status_last_terminated_reason is a sticky gauge --
        # it stays 1 until the next termination for another reason. Correlate
        # with a restart in the last 10m so this reflects a FRESH OOM kill, not
        # a long-resolved one. (The #176 Grafana OOM was this failure mode.)
        - alert: ContainerOOMKilled
          expr: |
            (max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}) == 1)
            and on (namespace, pod, container)
            (changes(kube_pod_container_status_restarts_total[10m]) > 0)
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOMKilled"
            description: "Container was OOMKilled and restarted in the last 10m. Consider raising its memory limit."
        # The chart's KubeContainerWaiting waits `for: 1h`, and KubePodNotReady
        # is generic, so a pod stuck in CreateContainerError went unflagged for
        # ~17m-1h (samwise, 2026-09-27: a clock step left containerd's
        # container-name reservations wedged and the kubelet retried ~20k
        # times). The kubelet retries this state every few seconds, so 10m of
        # it is never a transient blip.
        - alert: ContainerCreateErrorStuck
          expr: |
            max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CreateContainerError"}) == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) stuck in CreateContainerError"
            description: "Container has been in CreateContainerError for >10m. Run `kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}`. For 'failed to reserve container name', deleting the pod (new UID, new names) clears it; restarting k3s-agent alone does not."
        # certmanager_certificate_expiration_timestamp_seconds comes from the
        # cert-manager ServiceMonitor (enabled in Task 4). Renewal runs at 30d
        # before expiry, so <14d means DNS-01 renewal has been failing ~16+
        # days -- a real safety net for a revoked Cloudflare token.
        - alert: CertificateExpiringSoon
          expr: |
            (min by (name, namespace) (certmanager_certificate_expiration_timestamp_seconds) - time()) / 86400 < 14
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in <14d"
            description: "cert-manager certificate is within 14 days of expiry, meaning automatic renewal has likely been failing. Check `kubectl -n cert-manager get certificate,order,challenge`."
        # The weekly restore-verification drill (k8s/backup/verify-cronjob.yaml,
        # schedule "0 5 * * 0"). Same dead-man pattern as ResticBackupStale:
        # 8d = weekly cadence + 1d grace; failed, crashed, and never-scheduled
        # runs all stop the success timestamp advancing. Two known gaps, both
        # accepted: (a) the metric is absent until the FIRST successful run
        # (mitigated by the manual green-path run at rollout), and (b) if the
        # CronJob object is deleted the metric goes absent and this never
        # fires -- the CronJob is git-managed, so its disappearance would be
        # a reviewed change (same accepted gap as ResticBackupStale).
        - alert: ResticVerifyStale
          expr: |
            (time() - max(kube_cronjob_status_last_successful_time{cronjob="restic-verify", namespace="backup"})) > 8 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Weekly restic restore-verification drill has not succeeded in over 8d"
            description: "No successful restic-verify CronJob run in >8d -- the backups are currently unverified. Check `kubectl -n backup get jobs` and the most recent restic-verify job's logs."
        # The ARC listener (homelab-dev-templates' self-hosted runner) crashed
        # every ~4s from 2026-10-21 to 2026-11-11 on an expired GitHub PAT
        # without alerting: the controller deletes and recreates the pod, so
        # restartCount stays 0 and KubePodCrashLooping never fires. A pod that
        # lives 4s is rarely caught at a 30s scrape, so Ready flickers and a
        # plain `for:` keeps resetting. Average it instead: a healthy listener
        # reads 1, the churning one read 0.03-0.27. The `or vector(0)` also
        # fires when no listener exists at all.
        - alert: ArcListenerNotReady
          expr: |
            avg_over_time((max(kube_pod_status_ready{namespace="arc-systems", pod=~".+-listener", condition="true"}) or vector(0))[30m:1m]) < 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ARC runner listener has not stayed Ready for 30m"
            description: "The arc-systems listener pod is crash-churning or missing, so homelab-dev-templates' template-push.yml cannot get a runner. Run `kubectl -n arc-systems logs -l app.kubernetes.io/component=runner-scale-set-listener --tail=5`. '401 Bad credentials' means the GitHub PAT expired: rotate it with scripts/install-arc-runner.sh in homelab-dev-templates."
