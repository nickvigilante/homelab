# The Grafana Viewer service-account token for mcp-grafana, sourced from BWS.
# Vault item `Homelab Grafana`, field `claude-mcp`, is the DR mirror.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp-token
  namespace: claude-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: grafana-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: 62abd349-f165-4ea3-91a9-b4cb005bdfcd # gitleaks:allow
