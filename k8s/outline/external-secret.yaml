# outline-secrets sourced from BWS. Nine keys total:
#
#   - secret-key, utils-secret -- generated `openssl rand -hex 32` values
#   - postgres-password, postgres-superuser-password -- bitnami chart
#     existingSecret consumes these via secretKeys in postgres-values.yaml
#   - s3-access-key, s3-secret-key -- Storj S3 gateway creds for uploads
#   - oidc-client-id -- the Authentik OIDC provider's client id
#   - oidc-client-secret -- SHARED with authentik-oidc-secrets/oidc-outline-client-secret
#     (same BWS UUID; one source of truth, one rotation point)
#   - database-url -- SYNTHESIZED via target.template from postgres-password +
#     the hardcoded in-cluster postgres hostname; not stored separately in
#     BWS so password rotations don't require a second BWS edit
#
# mergePolicy: Merge passes through all fetched keys unchanged; the
# template block ONLY overrides database-url. Without Merge, only keys
# named in the template would land in the in-cluster Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-secrets
  namespace: outline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: outline-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        # Kebab-case secretKeys must be accessed via `index . "..."` --
        # Go templates can't parse `.postgres-password` as a field path.
        database-url: postgres://outline:{{ index . "postgres-password" }}@postgres-postgresql.outline.svc.cluster.local:5432/outline
  data:
    - secretKey: secret-key
      remoteRef:
        key: 6a5003e8-e27d-4365-aef0-b45b0028bb20 # gitleaks:allow
    - secretKey: utils-secret
      remoteRef:
        key: aa3e7b05-d372-4600-b942-b45b0028bf9a # gitleaks:allow
    - secretKey: postgres-password
      remoteRef:
        key: 1d2a9ec1-e2e1-4dec-8cee-b45b002abdc3 # gitleaks:allow
    - secretKey: postgres-superuser-password
      remoteRef:
        key: 8acbdca8-5b19-4b00-be04-b45b0028c88b # gitleaks:allow
    - secretKey: s3-access-key
      remoteRef:
        key: e2eec4d8-a81e-409a-9f22-b45b0028ad78 # gitleaks:allow
    - secretKey: s3-secret-key
      remoteRef:
        key: 8caa1ccd-c96b-4ae1-b19d-b45b0028b21e # gitleaks:allow
    - secretKey: oidc-client-id
      remoteRef:
        key: 2d7c917e-4719-4de3-b2df-b45b0028b68e # gitleaks:allow
    - secretKey: oidc-client-secret
      remoteRef:
        # Shared with authentik-oidc-secrets/oidc-outline-client-secret.
        key: 3e701375-e813-4c52-a313-b45b00289a1b # gitleaks:allow
