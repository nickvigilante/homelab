# renovate-credentials sourced from BWS. Four keys:
#
#   - GITHUB_APP_ID: the numeric App ID from the GitHub App's settings page.
#   - GITHUB_APP_INSTALLATION_ID: the number at the end of the installation URL
#     (github.com/settings/installations/<id>).
#   - GITHUB_APP_PRIVATE_KEY: the app's PEM private key, newlines intact. The
#     token step mounts it as a file and uses it to sign a short-lived JWT.
#   - UPTIME_KUMA_PUSH_URL: the push URL of the `renovate` monitor in Uptime
#     Kuma, in the form http://uptime-kuma.monitoring.svc.cluster.local:3001/api/push/<token>.
#
# Each remoteRef.key is the id of the BWS secret of the same name, kept in the
# `homelab` project: renovate-github-app-id, renovate-github-app-installation-id,
# renovate-github-app-private-key and renovate-uptime-kuma-push-url.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-credentials
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: renovate-credentials
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: de1c1989-5e79-44d4-ba41-b4ff016ee3fb # gitleaks:allow
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef:
        key: 6646bdf2-f225-4f27-870a-b4ff016f3ea3 # gitleaks:allow
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: 7f4604b1-4a61-4974-85a6-b4ff016fca18 # gitleaks:allow
    - secretKey: UPTIME_KUMA_PUSH_URL
      remoteRef:
        key: 396edbbb-421c-4d96-8aab-b4ff0179fadd # gitleaks:allow
