# Flux takeover (bitnami/postgresql, backing Coder's DB).
#
# Why a separate release: the official Coder chart does not bundle
# postgres (unlike Authentik's chart which does). So postgres runs
# standalone here, and Coder points at it via CODER_PG_CONNECTION_URL
# (see helmrelease.yaml).
#
# releaseName MUST be `postgres` so the bitnami StatefulSet auto-names
# its PVC `data-postgres-postgresql-0`, matching what's pre-created in
# pv-pvc.yaml. Adopting the existing helm-installed release: same
# releaseName/targetNamespace/chart/version/values as what's already
# running, so helm-controller's first reconcile is a no-op upgrade.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: coder
spec:
  releaseName: postgres
  targetNamespace: coder
  interval: 30m
  chart:
    spec:
      chart: postgresql
      version: "18.8.17"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    # Pin the postgres image by DIGEST. The bitnami/postgresql chart
    # ships a ROLLING :latest tag (Bitnami's 2025-08 free-tier change),
    # so pinning the chart version alone does NOT pin the image -- a pod
    # restart could pull a newer postgres MAJOR and fail to start
    # against the existing 18.x data dir. This digest freezes the exact
    # image running today (postgres 18.3.0). Durable migration off
    # Bitnami tracked in #121.
    image:
      registry: docker.io
      repository: bitnami/postgresql
      digest: "sha256:b30a01e1cee6b2018eb86081dd13fef206f0997e705c53286af9eca7558affac"

    auth:
      username: coder
      database: coder
      # Read both the user password and the superuser password from
      # the same Secret. Bitnami expects keys `password` (user) and
      # `postgres-password` (superuser). Map them explicitly.
      existingSecret: coder-secrets
      secretKeys:
        adminPasswordKey: postgres-superuser-password
        userPasswordKey: postgres-password

    primary:
      persistence:
        enabled: true
        storageClass: manual
        existingClaim: data-postgres-postgresql-0
      # Pin to gandalf -- the PV is hostPath here.
      nodeSelector:
        kubernetes.io/hostname: gandalf
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    # kubelet creates hostPath dirs as root:root, but bitnami postgres
    # runs as uid 1001. Without this init container the pod
    # CrashLoopBackOffs with "cannot create directory ... Permission
    # denied" on first start.
    volumePermissions:
      enabled: true
