# Template — do NOT apply this file directly. The real Secret is
# created via `kubectl create secret generic` sourced from a Bitwarden
# item (see README.md). This file exists so the required keys and
# their roles are documented in the repo.
apiVersion: v1
kind: Secret
metadata:
  name: coder-secrets
  namespace: coder
type: Opaque
stringData:
  # PostgreSQL credentials. Both the bitnami postgres StatefulSet AND
  # Coder's server read these.
  # `postgres-password` is the password for the `coder` user.
  # `postgres-superuser-password` is the password for the `postgres`
  # superuser (used by bitnami for init / health checks).
  postgres-password: REPLACE_WITH_CODER_POSTGRES_PASSWORD
  postgres-superuser-password: REPLACE_WITH_CODER_POSTGRES_SUPERUSER_PASSWORD

  # Fully assembled postgres connection URL Coder reads. Encodes the
  # same `postgres-password` value above but in libpq URL form. Keep
  # them in sync — rotation means updating both fields.
  # Format: postgres://coder:<password>@postgres-postgresql.coder.svc.cluster.local:5432/coder?sslmode=disable
  pg-connection-url: REPLACE_WITH_CODER_PG_CONNECTION_URL

  # OIDC credentials from the Authentik OAuth2/OpenID provider you
  # create for Coder. Created during step 7 of the README.
  oidc-client-id: REPLACE_WITH_AUTHENTIK_CODER_CLIENT_ID
  oidc-client-secret: REPLACE_WITH_AUTHENTIK_CODER_CLIENT_SECRET
