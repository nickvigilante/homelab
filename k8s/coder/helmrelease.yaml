# Flux takeover (official coder-v2/coder chart). Adopting the existing
# helm-installed release: same releaseName/targetNamespace/chart/
# version/values as what's already running, so helm-controller's first
# reconcile is a no-op upgrade with the existing pod preserved.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder
  namespace: coder
spec:
  releaseName: coder
  targetNamespace: coder
  interval: 30m
  dependsOn:
    - name: postgres
  chart:
    spec:
      chart: coder
      version: "2.37.0"
      sourceRef:
        kind: HelmRepository
        name: coder-v2
        namespace: flux-system
  values:
    coder:
      # Single-node k3s cluster + postgres PV is hostPath-bound to gandalf.
      nodeSelector:
        kubernetes.io/hostname: gandalf

      replicaCount: 1

      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi

      # The Coder chart creates a ServiceAccount with permission to
      # manage pods/PVCs/deployments in its own namespace. Workspace
      # pods get scheduled into the same namespace by default -- the
      # Kubernetes workspace template relies on this. Leave defaults.
      serviceAccount:
        enableDeployments: true
        workspacePerms: true

      env:
        # Connection string is fully assembled in the Secret so the
        # password never appears in this values file or in plain env
        # entries.
        - name: CODER_PG_CONNECTION_URL
          valueFrom:
            secretKeyRef:
              name: coder-secrets
              key: pg-connection-url

        # The URL users hit to reach the Coder dashboard. Must match
        # the ingress host below or workspace agents will fail to
        # connect. Workspace agents reconnect to this URL on next
        # heartbeat after the coder server restarts, so changing it
        # rolls the agents' control-plane connection (workspace pods
        # themselves keep running).
        - name: CODER_ACCESS_URL
          value: https://coder.vigihome.net

        # Telemetry stays on: the Premium license (AI Governance) requires
        # it. Coder sends anonymized usage stats. This is the default,
        # but it is set explicitly so nobody flips it off again for
        # privacy without knowing it breaks license compliance.
        - name: CODER_TELEMETRY_ENABLE
          value: "true"

        # Enables Coder as an OAuth2 provider (the `oauth2` experiment).
        # Experimental and unstable upstream -- the API can break between
        # Coder releases, so re-check it when bumping the chart version.
        # Comma-separate any future experiments in this one variable.
        # See https://coder.com/beta-docs/admin/integrations/oauth2-provider.
        - name: CODER_EXPERIMENTS
          value: oauth2

        # Lets Coder Agents' MCP client reach the homelab's private
        # addresses. Coder's SSRF guard blocks RFC 1918 and CGNAT
        # destinations for MCP traffic (OAuth discovery, token
        # exchange, and tool calls) unless the range is listed here.
        # Every `*.vigihome.net` name resolves to one of gandalf's two
        # addresses -- LAN and tailnet, per Pi-hole's dnsmasq wildcard
        # -- and Traefik fronts the services behind them, so allowing
        # exactly those two /32s covers Outline and Home Assistant.
        # Both are needed because the resolver may return either one
        # first. Two more exact /32s allow the in-cluster MCP servers
        # (below), and none of this opens the pod or service CIDRs as
        # a whole. Changing this restarts the coder pod; running
        # workspaces are unaffected. The MCP servers themselves are
        # registered from the infrastructure repo's `coder/` context
        # (#204).
        # The last two entries in the list are the fixed ClusterIPs of
        # the in-cluster Grafana and Kubernetes MCP servers
        # (k8s/claude-mcp/), reached over plain HTTP by service DNS
        # name. Only exact /32s are listed so the rest of the service
        # CIDR stays blocked.
        - name: CODER_MCP_ALLOWED_PRIVATE_CIDRS
          value: 192.168.50.135/32,100.92.2.25/32,10.43.0.200/32,10.43.0.201/32

        # OIDC via Authentik. Local password auth stays enabled by
        # default so you can fall back to the bootstrap owner account
        # when Authentik is down -- Coder is downstream of Authentik in
        # the SPOF chain, keep the parachute (see README.md step 8).
        - name: CODER_OIDC_ISSUER_URL
          value: https://authentik.vigihome.net/application/o/coder/
        - name: CODER_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: coder-secrets
              key: oidc-client-id
        - name: CODER_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: coder-secrets
              key: oidc-client-secret
        # Empty string accepts any email domain. Tighten later if you
        # add collaborators with different domains.
        - name: CODER_OIDC_EMAIL_DOMAIN
          value: ""
        - name: CODER_OIDC_SIGN_IN_TEXT
          value: Sign in with Authentik
        # First user to log in via OIDC is auto-assigned owner. After
        # that, role mapping is done in the Coder UI. The bootstrap
        # owner created via local auth (see README) stays as the
        # failsafe.
        - name: CODER_OIDC_IGNORE_EMAIL_VERIFIED
          value: "false"
        # Authentik's coder provider issues 5-minute access tokens
        # (its own default) and only hands out a refresh token if the
        # client requests the offline_access scope. Without it, Coder
        # has nothing to silently renew the session with and force
        # logs users out on every expiry -- every ~5 minutes. Adding
        # offline_access to Coder's default scope list (openid,
        # profile, email) fixes it; Authentik's refresh_token_validity
        # on the coder provider is already 30 days. Existing sessions
        # need a fresh login to pick up a refresh token -- see
        # https://coder.com/docs/admin/users/oidc-auth/refresh-tokens.
        - name: CODER_OIDC_SCOPES
          value: openid,profile,email,offline_access

        # The DERP healthcheck's STUN test runs against every host in
        # this list, and doesn't fail fast: on a non-response it
        # retries every ~2s until the caller's context dies, so one
        # dead server consumes the ENTIRE health-check window and
        # drags the whole DERP section down with it (confirmed via a
        # live pprof goroutine dump -- stun4.l.google.com went silent
        # while the other four Google STUN hosts still answered).
        # STUN only helps negotiate direct P2P connections instead of
        # relaying through the embedded DERP server; in a single-
        # replica homelab that embedded relay is already same-host
        # and fast (confirmed via direct testing), so there's no real
        # P2P win to trade for depending on a public STUN server list
        # that keeps rotting out from under us. Disabling it removes
        # this whole failure class instead of trading one flaky
        # Google host for another.
        - name: CODER_DERP_SERVER_STUN_ADDRESSES
          value: disable

      service:
        type: ClusterIP

      # Chart-managed Ingress for https://coder.vigihome.net. Coder's
      # chart uses singular `host` and a flat `tls.{enable, secretName}`
      # shape -- different from the hosts[]/tls[] convention other
      # charts use in this repo, but functionally equivalent for our
      # single-host case.
      ingress:
        enable: true
        className: traefik
        host: coder.vigihome.net
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        tls:
          enable: true
          # Reflected into the `coder` namespace by emberstack/reflector
          # via cert-manager's secretTemplate annotations on
          # k8s/cert-manager/certificate.yaml.
          secretName: vigihome-tls
