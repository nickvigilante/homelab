nodeSelector:
  kubernetes.io/hostname: gandalf

# Bind port 53 directly on the host (UDP+TCP) without hostNetwork.
# Web traffic stays on the pod network and is fronted by Traefik ingress.
hostNetwork: false
dnsHostPort:
  enabled: true
  port: 53

# DNS Service is unused externally (host:53 reaches Pi-hole via hostPort).
# Keep it ClusterIP just so Pi-hole's own DNS lookups inside the cluster work.
serviceDns:
  type: ClusterIP

# Web served via Traefik. Pi-hole only listens HTTP inside the pod;
# Traefik terminates TLS with its default cert for https://pi.hole/.
serviceWeb:
  type: ClusterIP
  http:
    enabled: true
    port: 80
  https:
    enabled: false

# Admin password lives in a Kubernetes Secret the user creates by hand.
# `adminPassword: ""` ensures no plaintext default is templated.
admin:
  enabled: true
  existingSecret: pihole-admin
  passwordKey: password
adminPassword: ""

# Reuse the manual PV+PVC mapped to /opt/pihole/etc-pihole on the host.
# Migrated config (pihole.toml, gravity.db, pihole-FTL.db, etc.) lives there.
persistentVolumeClaim:
  enabled: true
  existingClaim: pihole-config

# Default upstreams — overridden once migrated pihole.toml takes effect.
DNS1: "1.1.1.1"
DNS2: "9.9.9.9"

# v6 FTL listening mode + timezone
extraEnvVars:
  FTLCONF_dns_listeningMode: "all"
  TZ: "America/New_York"

# Ingress at pi.hole — Traefik serves both http and https (default cert on 443).
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
  path: /
  pathType: Prefix
  hosts:
    - pi.hole

# Local DNS records and dnsmasq directives both live in pihole.toml on
# the PV. Both are managed via the Pi-hole admin UI and persist via the
# nightly restic backup of the PV; a from-scratch rebuild from the repo
# alone would not recover these. Two layers, used for different things:
#
# 1) Local DNS Records (Settings → Local DNS Records → Add)
#    Used for one-off A records that don't fit a pattern, e.g. `pi.hole`
#    (Pi-hole's own UI name). Stored in pihole.toml's `dns.hosts` array.
#    Avoid for *.vigihome.net hostnames — use the wildcard below.
#
# 2) `misc.dnsmasq_lines` (Settings → All settings → Misc → dnsmasq_lines)
#    Used for raw dnsmasq directives. The canonical wildcard for every
#    homelab service is two lines (order matters for sequential
#    clients — LAN first so on-LAN requests don't pay tailnet overhead):
#
#       address=/vigihome.net/192.168.50.135
#       address=/vigihome.net/100.92.2.25
#
#    Returns both IPs in the DNS answer:
#      - 192.168.50.135 → gandalf's LAN IP. Fast path for on-LAN clients
#        (home Wi-Fi, gandalf itself, ethernet workstations).
#      - 100.92.2.25 → gandalf's tailnet IP. Fallback for off-LAN tailnet
#        clients (e.g. cellular MacBook) when no exit node is selected.
#        Happy-eyeballs clients race both; sequential clients fall through
#        when LAN times out.
#
#    With the wildcard in place, NEW *.vigihome.net hostnames need no
#    Pi-hole config edit — they resolve automatically. The chart's
#    customDnsEntries / additionalHostsEntries are still no-ops for
#    names FTL has an opinion about (pi.hole, etc.).
