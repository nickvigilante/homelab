apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  releaseName: uptime-kuma
  targetNamespace: monitoring
  interval: 30m
  chart:
    spec:
      chart: uptime-kuma
      version: "4.1.0"
      sourceRef:
        kind: HelmRepository
        name: uptime-kuma
        namespace: flux-system
  values:
    image:
      tag: ""
    useDeploy: true
    service:
      type: ClusterIP
      port: 3001
    nodeSelector:
      kubernetes.io/hostname: gandalf
    volume:
      enabled: true
      existingClaim: uptime-kuma-data
    resources:
      requests:
        cpu: 50m
        memory: 144Mi
    podEnv:
      - name: TZ
        value: America/New_York
      - name: UPTIME_KUMA_BEHIND_PROXY
        value: "1"
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: uptime-kuma.vigihome.net
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - uptime-kuma.vigihome.net
          secretName: vigihome-tls
