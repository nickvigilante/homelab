image:
  # Let the chart's appVersion pin the image tag — easier to bump via chart upgrade.
  tag: ""

# StatefulSet would be overkill for a single-replica monitoring app with a
# pre-bound PV. Default (Deployment) is fine.
useDeploy: true

service:
  type: ClusterIP
  port: 3001

# Pin to gandalf — the PV is hostPath-bound to /opt/uptime-kuma/data here.
nodeSelector:
  kubernetes.io/hostname: gandalf

volume:
  enabled: true
  existingClaim: uptime-kuma-data

# Modest budget — Uptime Kuma is light. Add a request so the scheduler can
# place it predictably; no limit so the occasional notification storm isn't
# OOM-killed.
resources:
  requests:
    cpu: 50m
    memory: 128Mi

podEnv:
  - name: TZ
    value: America/New_York
  # Trust the X-Forwarded-* headers from Traefik so the audit log records
  # the real client IP, not the ingress controller's ClusterIP.
  - name: UPTIME_KUMA_BEHIND_PROXY
    value: "1"

# Chart-managed Ingress for https://uptime-kuma.vigihome.net. Replaces
# the previous setup which had two Ingresses side by side: this chart
# Ingress at http://uptime.home plus a raw `ingress-vigihome.yaml` at
# the new HTTPS host. The chart now owns the vigihome host directly
# and the raw file is dropped in this PR.
#
# The chart merges its default nginx-targeted annotations with these;
# Traefik silently ignores the nginx ones, so the only annotation that
# actually changes behavior is the entrypoint pin to `websecure`.
# Kuma's UI uses Socket.IO — Traefik passes the WebSocket upgrade
# through transparently, no middleware needed.
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: uptime-kuma.vigihome.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - uptime-kuma.vigihome.net
      # Reflected into the `monitoring` namespace by emberstack/reflector
      # via cert-manager's secretTemplate annotations on
      # k8s/cert-manager/certificate.yaml.
      secretName: vigihome-tls
