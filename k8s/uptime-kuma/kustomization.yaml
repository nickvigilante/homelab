apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pv-pvc.yaml
  - helmrelease.yaml
  # Pull in the chart repo HelmRepository so Flux applies it as part of this app's stack.
  # Per-service relative path keeps each app self-contained until enough services share
  # a chart repo to justify a cluster-level sources Kustomization.
  - ../../sources/uptime-kuma.yaml
