# Template — do NOT apply this file directly. The real Secret is
# created via `kubectl create secret generic` sourced from a Bitwarden
# item (see README.md). This file exists so the required keys and
# their roles are documented in the repo.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  # Cloudflare API token scoped to Zone.DNS Edit + Zone.Zone Read on
  # vigihome.net only. cert-manager uses it for DNS-01: creates a
  # TXT record under _acme-challenge.<name>.vigihome.net, waits for
  # LE to verify, then deletes the record.
  #
  # Source of truth: Bitwarden item
  #   `Cloudflare DNS API Token — vigihome.net`
  #
  # Rotation: rotate in the Cloudflare UI, update Bitwarden, then
  # overwrite the Secret with the README's `kubectl create secret
  # generic ... --dry-run=client -o yaml | kubectl apply -f -` recipe.
  api-token: REPLACE_WITH_CLOUDFLARE_API_TOKEN
