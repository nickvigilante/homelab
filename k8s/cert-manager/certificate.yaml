# Wildcard TLS certificate for vigihome.net (apex + every one-level
# subdomain). Single cert covers everything; consumer Ingresses
# reference the reflected Secret rather than each requesting their
# own cert (which would burn LE's 5-duplicate-certs-per-week budget
# and add per-service moving parts).
#
# Issuer: letsencrypt-prod. The staging-first dance from PR #24's
# original validation is documented in this dir's README under
# "Validating a risky change against staging first" — only flip
# `issuerRef.name` back to staging if you're changing something
# risky (new dnsNames, key algorithm, etc.) and want a dry-run.
#
# Secret distribution: emberstack/reflector (installed in PR #26)
# watches the issued Secret and mirrors it into every namespace
# listed in `secretTemplate.annotations.reflection-auto-namespaces`
# below. To add a service onto HTTPS-via-vigihome, append its
# namespace to that list and `kubectl apply` this file —
# cert-manager copies the annotations to the Secret on next
# reconcile, reflector picks up the new namespace within seconds.
#
# Key algorithm: ECDSA P-256. Browser-trusted, ~10× smaller and
# faster than RSA-2048, lower TLS handshake CPU on the Pi peers.
# Duration / renewBefore: 90d / 30d — LE's max validity and a 30-day
# buffer is plenty even if a DNS-01 challenge fails for a few days.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vigihome-tls
  namespace: cert-manager
spec:
  secretName: vigihome-tls
  secretTemplate:
    annotations:
      # Reflector reads these off the issued Secret. cert-manager copies
      # them from this `secretTemplate` block on every reconcile, so the
      # source of truth for "who gets a mirror" is this manifest.
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      # Comma-separated list of consumer namespaces. Add a namespace
      # here when migrating a service onto HTTPS at *.vigihome.net.
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "homepage,networking,auth,monitoring,media"
  duration: 2160h    # 90 days
  renewBefore: 720h  # 30 days before expiry
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - vigihome.net
    - "*.vigihome.net"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
