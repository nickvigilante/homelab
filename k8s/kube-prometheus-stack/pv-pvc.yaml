# Pre-created hostPath PV for Grafana so the nightly restic backup captures
# user-added dashboards/settings. Prometheus/Alertmanager use disposable
# local-path volumes and are deliberately NOT backed up (see README). The PV
# is gandalf-pinned (storageClass: manual, nodeAffinity) so it co-locates with
# the gandalf-pinned Grafana pod. Pre-flight: on gandalf,
#   sudo mkdir -p /opt/grafana && sudo chown 472:472 /opt/grafana
# (Grafana runs as uid 472).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-data
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /opt/grafana
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["gandalf"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual
  resources:
    requests:
      storage: 5Gi
  volumeName: grafana-data
