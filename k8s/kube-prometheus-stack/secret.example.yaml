# TEMPLATE ONLY — do not apply as-is. The real Secret is created via kubectl
# from Bitwarden item 'Homelab Grafana' (see README.md). Holds the local-admin
# fallback creds AND the OIDC client secret (the same value fed to Authentik
# via authentik-oidc-secrets). Keys admin-user/admin-password match the chart's
# grafana.admin.{userKey,passwordKey}; oidc-client-secret is consumed via
# grafana.envValueFrom → GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET.
#
# Bitwarden 'Homelab Grafana' field → key mapping:
#   admin-user          ← field admin-user          (e.g. admin-local)
#   admin-password      ← field admin-password      (strong password)
#   oidc-client-secret  ← field oidc-client-secret  (openssl rand -hex 64)
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: monitoring
type: Opaque
stringData:
  admin-user: REPLACE_WITH_GRAFANA_ADMIN_USER
  admin-password: REPLACE_WITH_GRAFANA_ADMIN_PASSWORD
  oidc-client-secret: REPLACE_WITH_GRAFANA_OIDC_CLIENT_SECRET
