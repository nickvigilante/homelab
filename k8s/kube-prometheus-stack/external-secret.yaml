# grafana-secrets sourced from BWS. Three keys -- two are
# monitoring-specific (the local-admin fallback creds), one is shared
# with authentik-oidc-secrets (`grafana-oidc-client-secret`) since
# the same OIDC client secret is referenced on both sides of the
# Authentik <-> Grafana OIDC link.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: grafana-secrets
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: 6ce99de9-aaed-4f62-9028-b45b0028a466 # gitleaks:allow
    - secretKey: admin-password
      remoteRef:
        key: c0963bd4-be0f-4a0a-b506-b45b0028a8d3 # gitleaks:allow
    - secretKey: oidc-client-secret
      remoteRef:
        # Shared with authentik-oidc-secrets/oidc-grafana-client-secret.
        key: 6c8ad651-f593-4ea2-903f-b45b0028a01f # gitleaks:allow
