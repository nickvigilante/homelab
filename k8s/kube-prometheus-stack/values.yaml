# kube-prometheus-stack v85.3.3 (appVersion v0.90.1). Metrics + alerting for
# the homelab (#76). Installed into the existing `monitoring` namespace
# (alongside Uptime Kuma). Heavy pods pin to gandalf; node-exporter is a
# DaemonSet on every node. See README.md for the apply runbook.
#
# Secrets referenced here (created from Bitwarden at apply time, never in repo):
#   grafana-secrets  — admin-user / admin-password / oidc-client-secret
#   smtp-relay       — smtp-password (reflected from auth/smtp-relay)
# Prerequisites (README): /opt/grafana on gandalf (uid 472), the grafana-data
# PV/PVC (pv-pvc.yaml), the Authentik grafana OIDC blueprint, and smtp-relay
# reflected into `monitoring` — must all exist before `helm install`.

# --- k3s control-plane components -------------------------------------------
# k3s embeds kube-controller-manager / kube-scheduler / kube-proxy in the k3s
# process with metrics bound to localhost (not scrapeable from a pod), and uses
# a sqlite datastore (no etcd). Disabling these stops their ServiceMonitors and
# the "<component>Down" alert rules from firing permanent false positives.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# --- Prometheus -----------------------------------------------------------
prometheus:
  prometheusSpec:
    # Pin to gandalf (amd64, RAM headroom). local-path is node-local, so the
    # TSDB volume lands on gandalf with the pod.
    nodeSelector:
      kubernetes.io/hostname: gandalf
    retention: 15d
    retentionSize: "18GB" # headroom under the 20Gi PVC
    # Discover ServiceMonitors/PodMonitors/Rules/Probes in any namespace, not
    # just chart-labelled ones (so future per-app metrics get scraped).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 3Gi

# --- Alertmanager: route firing alerts to email via the Forward Email relay
alertmanager:
  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/hostname: gandalf
    # Alertmanager has no Ingress (open admin API — reached via
    # `kubectl port-forward svc/...alertmanager 9093:9093`). Without this,
    # externalUrl defaults to the in-cluster Service DNS, which leaks into
    # notification links (emails) as a non-resolvable address. Point it at the
    # port-forward address so the email "source" links are clickable in that
    # workflow. A fully-reachable URL needs forward-auth exposure — see #117.
    externalUrl: http://localhost:9093
    # Mount the reflected smtp-relay Secret at
    # /etc/alertmanager/secrets/smtp-relay/{smtp-username,smtp-password}.
    secrets:
      - smtp-relay
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  # Forward Email over STARTTLS on 587. (Alertmanager does NOT support implicit
  # TLS / SMTPS on 465 — it only does STARTTLS, toggled by smtp_require_tls.
  # The restic job uses 465 because it speaks smtps:// directly; Alertmanager
  # can't, so it uses 587.) auth_username is the relay alias (noreply@, same as
  # `from` — not a secret); the password is read from the mounted file so it
  # never lands in the repo.
  config:
    global:
      smtp_smarthost: "smtp.forwardemail.net:587"
      smtp_from: noreply@vigihome.net
      smtp_require_tls: true
      smtp_hello: vigihome.net
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: email
      routes:
        # Watchdog is the chart's always-firing heartbeat — if it stops
        # arriving, the alerting pipeline itself is broken. Throttle to daily.
        - matchers: ['alertname = "Watchdog"']
          receiver: email
          repeat_interval: 24h
    receivers:
      - name: email
        email_configs:
          - to: vigihome-admin@vigiemail.com
            from: noreply@vigihome.net
            smarthost: "smtp.forwardemail.net:587"
            auth_username: noreply@vigihome.net
            auth_password_file: /etc/alertmanager/secrets/smtp-relay/smtp-password
            require_tls: true
            send_resolved: true

# --- Grafana: dashboards behind Authentik OIDC + a local-admin fallback ----
grafana:
  nodeSelector:
    kubernetes.io/hostname: gandalf
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # Persist to the pre-created hostPath PV at /opt/grafana (gandalf) so restic
  # backs up user-added dashboards. PV/PVC live in pv-pvc.yaml.
  persistence:
    enabled: true
    type: pvc
    existingClaim: grafana-data
  # DO NOT RE-ENABLE. The chart's init-chown-data initContainer runs
  # `chown -R 472:472 /var/lib/grafana` with capabilities=[CHOWN] (no
  # DAC_OVERRIDE). On first install that works -- the tree is empty and
  # root-owned. On every subsequent restart it fails with EACCES because
  # root-without-DAC_OVERRIDE can't traverse into the 0700-mode pdf/csv/png
  # report-export subdirs Grafana itself created on prior boots, owned by uid
  # 472. The pod CrashLoopBackOffs forever (2026-06-03, after a kernel
  # unattended-upgrade reboot).
  #
  # We don't need this initContainer: /opt/grafana is provisioned with the
  # right owner/mode by `ansible/provision-gandalf.yml` (idempotent on every
  # play run) plus a `/etc/tmpfiles.d/grafana.conf` systemd-tmpfiles entry
  # that re-creates the dir at boot if missing. Step 1 of this dir's README
  # documents the runbook.
  initChownData:
    enabled: false
  # Local-admin fallback — reachable when Authentik is down (SPOF discipline).
  admin:
    existingSecret: grafana-secrets
    userKey: admin-user
    passwordKey: admin-password
  # Inject the OIDC client secret as the env var grafana.ini interpolates.
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-secrets
        key: oidc-client-secret
  grafana.ini:
    server:
      root_url: https://grafana.vigihome.net
    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: grafana
      scopes: "openid email profile"
      auth_url: https://authentik.vigihome.net/application/o/authorize/
      token_url: https://authentik.vigihome.net/application/o/token/
      api_url: https://authentik.vigihome.net/application/o/userinfo/
      # homelab-users members become Admin; everyone else Viewer.
      role_attribute_path: "contains(groups[*], 'homelab-users') && 'Admin' || 'Viewer'"
      # Keep the username/password login form so the local admin (and the
      # Homepage Viewer account) still work alongside OIDC.
      allow_assign_grafana_admin: true
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
      - grafana.vigihome.net
    tls:
      - hosts: ["grafana.vigihome.net"]
        secretName: vigihome-tls

# --- kube-state-metrics (cluster object state) ----------------------------
# CRS (Custom Resource State) exposes Flux CRDs as `gotk_resource_info{ready=...}`
# metrics. Without this, the chart-bundled kube-state-metrics only knows about
# native k8s objects — Flux HelmRelease/Kustomization Ready state is invisible
# to Prometheus and the Flux dashboards / FluxReconciliationFailure alert have
# nothing to evaluate. The PodMonitor in `k8s/flux-monitoring/` scrapes Flux
# controller *runtime* metrics; this CRS block is the missing other half.
#
# Config taken from the upstream Flux monitoring example
# (https://github.com/fluxcd/flux2-monitoring-example, file
# `monitoring/controllers/kube-prometheus-stack/kube-state-metrics-config.yaml`),
# minus:
#   - `collectors: []` and `--custom-resource-state-only=true` so the default
#     k8s-object metrics (used everywhere by kps dashboards) keep working
#   - the `image.toolkit.fluxcd.io` GVKs and corresponding RBAC entries, since
#     image-automation/reflector controllers aren't installed (no CRDs present)
kube-state-metrics:
  nodeSelector:
    kubernetes.io/hostname: gandalf
  rbac:
    extraRules:
      - apiGroups:
          - source.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
          - notification.toolkit.fluxcd.io
        resources:
          - gitrepositories
          - buckets
          - helmrepositories
          - helmcharts
          - ocirepositories
          - kustomizations
          - helmreleases
          - alerts
          - providers
          - receivers
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: kustomize.toolkit.fluxcd.io
              version: v1
              kind: Kustomization
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Kustomization resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, lastAppliedRevision]
                  source_name: [spec, sourceRef, name]
          - groupVersionKind:
              group: helm.toolkit.fluxcd.io
              version: v2
              kind: HelmRelease
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux HelmRelease resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, history, "0", chartVersion]
                  chart_name: [status, history, "0", chartName]
                  chart_app_version: [status, history, "0", appVersion]
                  chart_ref_name: [spec, chartRef, name]
                  chart_source_name: [spec, chart, spec, sourceRef, name]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: GitRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux GitRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: Bucket
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Bucket resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  endpoint: [spec, endpoint]
                  bucket_name: [spec, bucketName]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux HelmRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmChart
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux HelmChart resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  chart_name: [spec, chart]
                  chart_version: [spec, version]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: OCIRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux OCIRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]
          - groupVersionKind:
              group: notification.toolkit.fluxcd.io
              version: v1beta3
              kind: Alert
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Alert resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  suspended: [spec, suspend]
          - groupVersionKind:
              group: notification.toolkit.fluxcd.io
              version: v1beta3
              kind: Provider
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Provider resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  suspended: [spec, suspend]
          - groupVersionKind:
              group: notification.toolkit.fluxcd.io
              version: v1
              kind: Receiver
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Receiver resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  webhook_path: [status, webhookPath]

# --- node-exporter: DaemonSet on all nodes (gandalf amd64 + frodo/samwise
# arm64). Broad toleration so it schedules on every node, including any with
# taints. ---------------------------------------------------------------------
# Port moved 9100 → 9101: k3s's bundled Traefik binds hostPort 9100 (its
# `metrics` entrypoint) on whichever node it runs (gandalf), so the default
# node-exporter hostPort 9100 collides there and the pod stays Pending. The
# ServiceMonitor targets the port by name (http-metrics), so the number change
# is transparent to scraping.
prometheus-node-exporter:
  service:
    port: 9101
    targetPort: 9101
  tolerations:
    - operator: Exists
