# Authentik Helm values. Targets `authentik/authentik` v2026.8.x.
#
# Secret material (AUTHENTIK_SECRET_KEY, postgres password, bootstrap
# admin password) is NOT in this file — it lives in the `authentik-secrets`
# k8s Secret in namespace `auth`. See README.md for the
# `kubectl create secret` invocation that sources from Bitwarden.
#
# Upgrade note: authentik enforces sequential major.minor upgrades --
# skipping a major.minor line (e.g. 2026.2.x straight to 2026.8.x)
# crash-loops the server with "Major version skips are not allowed".
# Step through each major.minor release in order
# (see https://docs.goauthentik.io/install-config/upgrade/).

global:
  # Pin every component to gandalf — this is a single-node k3s cluster
  # and the postgres PV is hostPath-bound here.
  nodeSelector:
    kubernetes.io/hostname: gandalf

  # Soft pod anti-affinity is fine but doesn't help on n=1. Hard node
  # affinity with no expressions is a no-op. Keep defaults.

  # All Authentik components read these env vars at startup. Sourced
  # from a single k8s Secret to keep the moving parts down.
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: secret-key
    # Authentik reads postgres credentials from these env vars; the
    # bitnami postgres chart reads the same value out of the same
    # Secret via `postgresql.auth.existingSecret` below — keeps them
    # locked in sync.
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: postgres-password
    # First-run only: sets the akadmin password instead of letting
    # the chart auto-generate one. Safe to leave set after bootstrap;
    # password rotation should be done from the Authentik UI, which
    # writes to the DB and stops honoring this env on subsequent
    # runs.
    - name: AUTHENTIK_BOOTSTRAP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: bootstrap-password
    - name: AUTHENTIK_BOOTSTRAP_TOKEN
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: bootstrap-token
    # Trust Traefik as an upstream proxy so Authentik reads the real
    # client IP from X-Forwarded-For instead of recording the CNI
    # bridge IP (10.42.0.1) as the source of every request. Without
    # this, IP-based reputation policies bucket every login attempt
    # under one address and the audit log loses forensic value.
    #
    # Scope: pod CIDR + loopback. The actual browser IP only makes
    # it all the way through if Traefik's LoadBalancer Service is
    # set to externalTrafficPolicy: Local — otherwise XFF contains
    # the gandalf node IP (kube-proxy SNATs the connection on the
    # way in). That's still strictly better than 10.42.0.1.
    - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
      value: "127.0.0.0/8,10.42.0.0/16"

    # ---- SMTP via Forward Email (managed relay) -----------------------
    #
    # Outbound mail for: akadmin / nickv password recovery, breach alerts,
    # Authentik event notifications. Routed through Forward Email's SMTP
    # relay (smtp.forwardemail.net:465, implicit TLS).
    #
    # Credentials live in a SEPARATE Secret `smtp-relay` rather than in
    # `authentik-secrets` — SMTP creds are not Authentik-specific (other
    # services may consume the same relay later, with each service
    # holding its own copy of the Secret per RBAC blast-radius hygiene).
    #
    # SMTP envelope sender (USERNAME) is the bare address — Forward Email
    # ties SMTP AUTH to a verified sender at the configured domain.
    # From: display name (FROM) is set independently as a literal below
    # so recovery emails arrive as "vigihome auth <noreply@vigihome.net>"
    # rather than the default "authentik <…>".
    - name: AUTHENTIK_EMAIL__HOST
      value: "smtp.forwardemail.net"
    - name: AUTHENTIK_EMAIL__PORT
      value: "465"
    - name: AUTHENTIK_EMAIL__USE_SSL
      value: "true"
    - name: AUTHENTIK_EMAIL__USE_TLS
      value: "false"
    - name: AUTHENTIK_EMAIL__TIMEOUT
      value: "10"
    - name: AUTHENTIK_EMAIL__USERNAME
      valueFrom:
        secretKeyRef:
          name: smtp-relay
          key: smtp-username
    - name: AUTHENTIK_EMAIL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: smtp-relay
          key: smtp-password
    - name: AUTHENTIK_EMAIL__FROM
      value: "vigihome auth <noreply@vigihome.net>"

    # ---- OIDC client secrets for the blueprinted apps (#104) ----------
    # The Authentik blueprints reference these via !Env. Values come from
    # the authentik-oidc-secrets Secret (Bitwarden-backed) — one field per
    # app, the same secret the downstream service already holds. See
    # blueprints/applications/*.yaml and secret.example.yaml.
    - name: AUTHENTIK_OIDC_CODER_SECRET
      valueFrom:
        secretKeyRef:
          name: authentik-oidc-secrets
          key: oidc-coder-client-secret
    - name: AUTHENTIK_OIDC_OUTLINE_SECRET
      valueFrom:
        secretKeyRef:
          name: authentik-oidc-secrets
          key: oidc-outline-client-secret
    - name: AUTHENTIK_OIDC_GRAFANA_SECRET
      valueFrom:
        secretKeyRef:
          name: authentik-oidc-secrets
          key: oidc-grafana-client-secret

# Config-as-code (#104). Mounts the authentik-blueprints ConfigMap at
# /blueprints/mounted/cm-authentik-blueprints/; the worker discovers +
# reconciles every .yaml key on startup. Render the ConfigMap from
# k8s/authentik/blueprints/ — see that dir's README.
blueprints:
  configMaps:
    - authentik-blueprints

authentik:
  log_level: info
  # Setting authentik.* values directly conflicts with the env-var
  # pattern above; let the env vars drive instead. existingSecret
  # is left unset so chart doesn't create a competing config secret.

server:
  replicas: 1
  # Ingress for https://authentik.vigihome.net. Chart-managed — the rest
  # of the Authentik config already lives in this values block, so the
  # Ingress belongs here too. The legacy http://authentik.home Ingress
  # was dropped earlier (after Coder's OIDC issuer was flipped); now
  # the chart owns the new vigihome host directly. iss claims keep
  # validating against authentik.vigihome.net (same hostname as the
  # raw Ingress this replaces, so no downstream OIDC fallout).
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
      - authentik.vigihome.net
    tls:
      - hosts:
          - authentik.vigihome.net
        # Reflected into the `auth` namespace by emberstack/reflector
        # via cert-manager's secretTemplate annotations on
        # k8s/cert-manager/certificate.yaml.
        secretName: vigihome-tls

worker:
  replicas: 1

# Enable the bundled bitnami postgresql chart. The pre-created PVC at
# `data-authentik-postgresql-0` (see pv-pvc.yaml) gets adopted by the
# StatefulSet at first start.
postgresql:
  enabled: true
  auth:
    username: authentik
    database: authentik
    # Read both the user password and the superuser password from the
    # same Secret. Bitnami's existingSecret convention expects keys
    # `password` (for the auth.username user) and `postgres-password`
    # (for the postgres superuser). Map them explicitly.
    existingSecret: authentik-secrets
    secretKeys:
      adminPasswordKey: postgres-superuser-password
      userPasswordKey: postgres-password
  primary:
    persistence:
      enabled: true
      storageClass: manual
      existingClaim: data-authentik-postgresql-0
    # Pin to gandalf — the PV is hostPath here.
    nodeSelector:
      kubernetes.io/hostname: gandalf
  # hostPath dirs are created by kubelet as root:root, but the bitnami
  # postgres image runs as uid 1001. Without this init container the
  # pod CrashLoopBackOffs with "cannot create directory ... Permission
  # denied" on first start. The init container runs as root and chowns
  # the mount.
  volumePermissions:
    enabled: true
    # The chart's default init-container image (docker.io/debian:13-slim)
    # reproducibly failed to pull from gandalf on 2026-09-03 (two separate
    # attempts, "insufficient_scope: authorization failed" -- not a rate
    # limit, and not seen on any other docker.io image pulled that day).
    # Point it at the postgres image instead: it's already pulled for the
    # main container, and a Debian-based image ships the coreutils
    # (chown/chmod) this init step needs. Keep the tag in sync with the
    # chart's default postgresql.image.tag above.
    image:
      registry: docker.io
      repository: library/postgres
      tag: "17.11-bookworm"
