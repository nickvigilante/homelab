# auth-namespace Secrets sourced from BWS via the bitwarden
# ClusterSecretStore (#135 Task 7). Two ExternalSecrets in one file
# because they're co-located + the Flux Kustomization for k8s/authentik/
# treats them as one set.
#
# smtp-relay preserves the emberstack/reflector annotations via
# target.template so its mirrors into the `backup` and `monitoring`
# namespaces keep working after ESO takes over the source Secret.
# Without these annotations, reflector would stop mirroring on the next
# source-Secret reconcile, breaking alertmanager email + restic
# heartbeat email.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smtp-relay
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: smtp-relay
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: backup,monitoring
  data:
    - secretKey: smtp-username
      remoteRef:
        key: 93d1f793-81ab-4ffb-a2ac-b45b00288d17 # gitleaks:allow
    - secretKey: smtp-password
      remoteRef:
        key: e9902369-ed3f-44b7-a1e1-b45b0028918c # gitleaks:allow
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-oidc-secrets
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: authentik-oidc-secrets
    creationPolicy: Owner
  data:
    # Each OIDC client secret is a SINGLE BWS entry shared with its
    # consuming service's own ExternalSecret -- e.g.
    # `grafana-oidc-client-secret` is also referenced by
    # `monitoring/grafana-secrets`. One source-of-truth value, one
    # rotation point.
    - secretKey: oidc-coder-client-secret
      remoteRef:
        key: 0b36edd5-42c9-4ef4-8027-b45b002895c6 # gitleaks:allow
    - secretKey: oidc-outline-client-secret
      remoteRef:
        key: 3e701375-e813-4c52-a313-b45b00289a1b # gitleaks:allow
    - secretKey: oidc-grafana-client-secret
      remoteRef:
        key: 6c8ad651-f593-4ea2-903f-b45b0028a01f # gitleaks:allow
