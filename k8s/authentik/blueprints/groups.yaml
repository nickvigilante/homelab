version: 1
metadata:
  name: "homelab - groups"
entries:
  # The single homelab SSO group — gates Coder, Outline, and the
  # password-recovery flow. (The dedicated homelab-coder-users group was
  # retired in #115; with one operator it was redundant.)
  - model: authentik_core.group
    state: present
    identifiers:
      name: homelab-users
    attrs:
      is_superuser: false
