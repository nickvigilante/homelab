version: 1
metadata:
  name: "homelab - application - coder"
# Coder OIDC provider + application + group gate. client_secret is injected
# from the authentik-oidc-secrets Secret via !Env (never in the repo). Coder
# is gated on homelab-users (the single homelab SSO group; the dedicated
# homelab-coder-users group was retired in #115), and uses the EXPLICIT
# consent authorization flow (matches prod).
entries:
  - id: coder-provider
    model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: coder
    attrs:
      client_type: confidential
      client_id: bAF9z9JcHsoCNo4wnwuelJnr3GQAOFw2n6auvP7o
      client_secret: !Env [AUTHENTIK_OIDC_CODER_SECRET, ""]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: https://coder.vigihome.net/api/v2/users/oidc/callback
  - id: coder-app
    model: authentik_core.application
    state: present
    identifiers:
      slug: coder
    attrs:
      name: Coder
      provider: !KeyOf coder-provider
      meta_launch_url: https://coder.vigihome.net
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf coder-app
      group: !Find [authentik_core.group, [name, homelab-users]]
      order: 0
    attrs:
      enabled: true
      negate: false
