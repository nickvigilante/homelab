version: 1
metadata:
  name: "homelab - email scope mapping (email_verified=true)"
entries:
  # Override the shipped default `email` OAuth scope mapping so its claim
  # set includes email_verified=True. Targeted by its managed marker so the
  # override is reasserted on every worker start (self-healing against an
  # Authentik upgrade resetting the default). Some OIDC clients (Outline)
  # refuse to provision a user unless email_verified is present and true.
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      managed: goauthentik.io/providers/oauth2/scope-email
    attrs:
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True
        }
