# Additional Ingress for Authentik over HTTPS at authentik.vigihome.net.
#
# Lives alongside the chart-managed `http://authentik.home` Ingress (in
# values.yaml under `server.ingress`) so the cutover can be staged
# safely:
#   1. PR D1 (this one): add HTTPS Ingress. Both URLs work; OIDC
#      clients (Coder) still point at the old `http://authentik.home`
#      issuer so token validation is unaffected.
#   2. PR D2 (follow-up, coordinated): update Coder's OIDC issuer URL
#      in `k8s/coder/values.yaml` to `https://authentik.vigihome.net`
#      and helm-upgrade. Test Coder login end-to-end.
#   3. PR D3 (cleanup): remove the chart's HTTP Ingress
#      (`server.ingress.enabled: false` + delete the
#      `http://authentik.home` Pi-hole record).
#
# Why a raw Ingress and not values.yaml's `server.ingress`: the chart
# only supports a single Ingress config block, and we need different
# annotations (entrypoint) and TLS for the new host. Raw keeps the
# chart-managed Ingress untouched during the transition window and
# makes the vigihome-specific config trivial to delete in PR D3.
#
# Authentik's runtime behavior: Authentik derives canonical URLs from
# the request's Host header rather than from a single configured
# external URL. Visitors via authentik.vigihome.net get tokens with
# `iss=https://authentik.vigihome.net/...`; visitors via
# authentik.home get tokens with `iss=http://authentik.home/...`.
# That's why each OIDC client (Coder, future Jellyfin) has to be
# pointed at exactly one of those issuers and updated in lockstep with
# this cutover — there's no "both at once" mode.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-vigihome
  namespace: auth
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - authentik.vigihome.net
      # Reflected into the `auth` namespace by emberstack/reflector via
      # cert-manager's secretTemplate annotations on
      # k8s/cert-manager/certificate.yaml.
      secretName: vigihome-tls
  rules:
    - host: authentik.vigihome.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # Service exposed by the authentik Helm chart. Traefik
              # terminates TLS on `websecure` (443) and proxies plain
              # HTTP to authentik-server:80 in-cluster.
              service:
                name: authentik-server
                port:
                  number: 80
