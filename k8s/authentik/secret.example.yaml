# Template — do NOT apply this file directly. The real Secret is
# created via `kubectl create secret generic` sourced from a Bitwarden
# item (see README.md). This file exists so the required keys and
# their roles are documented in the repo.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-secrets
  namespace: auth
type: Opaque
stringData:
  # Authentik's internal encryption key. Cookie signing, encrypted DB
  # fields, etc. all derive from this. LOSE IT → LOSE EVERY ENCRYPTED
  # FIELD IN THE DB. Source of truth: Bitwarden `Homelab Authentik`.
  # Generate with: openssl rand -base64 60 | tr -d '\n'
  secret-key: REPLACE_WITH_AUTHENTIK_SECRET_KEY

  # PostgreSQL credentials. The Authentik server, worker, and the
  # bundled bitnami postgresql StatefulSet all read these.
  # `postgres-password` is the password for the `authentik` user;
  # `postgres-superuser-password` is the password for the `postgres`
  # superuser (used by bitnami for init / health checks).
  postgres-password: REPLACE_WITH_AUTHENTIK_POSTGRES_PASSWORD
  postgres-superuser-password: REPLACE_WITH_AUTHENTIK_POSTGRES_SUPERUSER_PASSWORD

  # Initial akadmin login. Read once at first start of authentik-server
  # to seed the admin user. Rotate via the Authentik UI afterwards.
  bootstrap-password: REPLACE_WITH_AUTHENTIK_BOOTSTRAP_PASSWORD
  # Initial API token for akadmin — lets you script Authentik via the
  # API before logging in via the UI. Optional; can be regenerated.
  bootstrap-token: REPLACE_WITH_AUTHENTIK_BOOTSTRAP_TOKEN
---
# Outbound SMTP credentials. Authentik reads these via
# AUTHENTIK_EMAIL__USERNAME / AUTHENTIK_EMAIL__PASSWORD /
# AUTHENTIK_EMAIL__FROM env vars in values.yaml. Source of truth:
# Bitwarden item `Homelab Mail Relay`. Provider: Forward Email (FOSS).
#
# This is the authoritative copy. emberstack/reflector mirrors it into
# other namespaces that need outbound mail — currently `backup` (for
# restic failure alerts). Add a namespace by appending it to the
# reflection-auto-namespaces annotation below.
#
# Why mirror rather than duplicate-and-rotate-by-hand: SMTP creds
# rotate as one unit in the Forward Email dashboard, and the source
# of truth is one Bitwarden item. Reflector keeps consumers in sync
# automatically without separate Bitwarden→kubectl invocations per
# namespace.
apiVersion: v1
kind: Secret
metadata:
  name: smtp-relay
  namespace: auth
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "backup,monitoring"
type: Opaque
stringData:
  # The verified sender at the Forward Email-managed domain — used both
  # as the SMTP AUTH username and as the From address on outbound mail.
  # Forward Email pins this to one verified address per credential pair.
  smtp-username: REPLACE_WITH_SMTP_USERNAME
  # The SMTP relay password generated in the Forward Email dashboard.
  # Acts as a per-credential token; rotates independently of the
  # account password.
  smtp-password: REPLACE_WITH_SMTP_PASSWORD
---
# OIDC client secrets for the blueprinted applications (#104). The
# Authentik blueprints reference these via !Env (the values land in the
# AUTHENTIK_OIDC_*_SECRET env vars wired in values.yaml), so the provider
# client_secret never lives in the repo. One value per OIDC app; each is
# the SAME secret the downstream service (Coder, Outline) already holds.
# Created from Bitwarden:
#   oidc-coder-client-secret   ← item 'Homelab Coder',   field oidc-client-secret
#   oidc-outline-client-secret ← item 'Homelab Outline', field oidc-client-secret
#   oidc-grafana-client-secret ← item 'Homelab Grafana', field oidc-client-secret
apiVersion: v1
kind: Secret
metadata:
  name: authentik-oidc-secrets
  namespace: auth
type: Opaque
stringData:
  oidc-coder-client-secret: REPLACE_WITH_CODER_OIDC_CLIENT_SECRET
  oidc-outline-client-secret: REPLACE_WITH_OUTLINE_OIDC_CLIENT_SECRET
  oidc-grafana-client-secret: REPLACE_WITH_GRAFANA_OIDC_CLIENT_SECRET
