apiVersion: v1
kind: Namespace
metadata:
  name: auth
  labels:
    # Pod Security Standards: enforce `baseline` level — blocks the most
    # dangerous patterns (privileged containers, hostNetwork, hostPID,
    # hostIPC, hostPath volumes outside whitelisted paths) without
    # breaking the existing chart deployment.
    #
    # NOT restricted: the bitnami postgresql chart's `volumePermissions`
    # init container runs as root (uid 0) to chown the hostPath PV mount
    # before postgres starts. Restricted disallows root entirely. Bumping
    # to restricted would require either (a) disabling volumePermissions
    # and chowning the hostPath manually on gandalf, or (b) switching to
    # a postgres chart that doesn't need volumePermissions. Either path
    # is its own change — out of scope for this hardening pass.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    # Audit + warn at restricted level — surfaces any drift toward the
    # tighter standard in k8s audit logs (when enabled) and as warnings
    # at apply time, without enforcing it. Cost-free defense in depth.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
