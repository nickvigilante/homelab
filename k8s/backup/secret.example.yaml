# Template only — DO NOT commit a copy of this file with real values.
# Real Secret is created out-of-band on gandalf via the README's bw recipe.
#
# Keys consumed by the restic container:
#   - RESTIC_REPOSITORY: where the backups live (Storj S3 path)
#   - RESTIC_PASSWORD:   the repository encryption key. If lost, every
#                        snapshot becomes unrecoverable. Source of truth
#                        is the Bitwarden item "Homelab Restic Repository".
#   - AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY: Storj S3 access grant
#                        scoped to the `homelab` bucket (write).
apiVersion: v1
kind: Secret
metadata:
  name: restic-credentials
  namespace: backup
type: Opaque
stringData:
  RESTIC_REPOSITORY: "s3:https://gateway.storjshare.io/homelab/restic"
  RESTIC_PASSWORD: "REPLACE_WITH_RESTIC_REPO_PASSWORD"
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_STORJ_S3_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_STORJ_S3_SECRET_KEY"
