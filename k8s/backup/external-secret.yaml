# restic-credentials sourced from BWS. Four keys, all read via envFrom by
# the backup/forget CronJobs and the init-job:
#
#   - RESTIC_REPOSITORY: where the backups live (Storj S3 path; not strictly
#     secret but kept in BWS so a future bucket move is a one-place edit)
#   - RESTIC_PASSWORD: AES-256 repo password. Lose this and every snapshot
#     becomes unrecoverable (BW item `Homelab Restic Repository` is the only
#     durable copy; BWS holds the cluster-readable mirror).
#   - AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY: Storj S3 grant scoped to
#     the `homelab` bucket with rwld (delete needed for `forget --prune`).
#
# Key names are uppercase + underscore because the CronJob containers read
# them via `envFrom: secretRef:` and they become env vars directly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-credentials
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: restic-credentials
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: c84278a2-039d-46ba-90f5-b465001ee755 # gitleaks:allow
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: ce18cc2f-2996-4b22-a385-b465001ee2a5 # gitleaks:allow
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: ce4acc6b-177a-4a33-b8c7-b465001eec15 # gitleaks:allow
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: 0b297ca2-f40c-4c3d-923b-b465001ef07d # gitleaks:allow
