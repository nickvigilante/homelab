# Daily backup CronJob. Reads source dirs via hostPath (read-only) and
# pushes deduplicated snapshots to the restic repo on Storj.
#
# Sources backed up:
#   - /opt/jellyfin/config                          (Jellyfin DB + settings)
#   - /opt/pihole/etc-pihole                        (Pi-hole config + gravity DB; FTL query DB excluded)
#   - /opt/uptime-kuma/data                         (Uptime Kuma SQLite DB + monitor config)
#   - /opt/authentik/postgres                       (Authentik PostgreSQL data; useless without AUTHENTIK_SECRET_KEY)
#   - /opt/coder/postgres                           (Coder PostgreSQL data; workspace home dirs are NOT backed up)
#   - /opt/outline/postgres                         (Outline PostgreSQL data; uploads live in Storj, not here)
#   - /mnt/storage/syncthing                        (Syncthing config + Sync folders; the DCIM/Pixel-Downloads
#                                                    folders are receiveonly from a phone and have no other replica
#                                                    path, so this backup is the only off-host copy for those files)
#
# The k3s state DB is deliberately NOT backed up. SQLite mode has no
# online snapshot facility (etcd-snapshot save only works in etcd
# mode), and a raw copy of state.db + WAL while k3s is writing would
# be inconsistent. Cluster definitions live in the homelab repo,
# kubectl-created Secrets reload from Bitwarden, dynamic PVCs come
# back via the local-path provisioner — that's the recovery model.
# See ../../CLAUDE.md and ../../ansible/provision-gandalf.yml.
#
# Failure signals: TWO independent channels.
#   1. Uptime Kuma push monitor (`restic-backup`) — pinged on success
#      and on failure (via trap). If the job dies before reaching either
#      branch, the monitor goes DOWN on its own when the heartbeat
#      interval expires — same signal, slower.
#   2. Email via Forward Email's SMTP relay — sent on failure only,
#      using the `smtp-relay` Secret in this namespace. The Secret is
#      mirrored from `auth/smtp-relay` by emberstack/reflector; the
#      annotations live on the source Secret. Out-of-band channel for
#      times when Uptime Kuma is also unreachable / not being watched.
#      Recipient hardcoded in env below (SMTP_TO); change there if
#      the homelab inbox moves.
#
# Schedule: 03:00 every day. Adjust via `spec.schedule` if 3am isn't quiet.
#
# Manual trigger (e.g. to test):
#   kubectl -n backup create job --from=cronjob/restic-backup test-backup-$(date +%s)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-backup
  namespace: backup
spec:
  schedule: "0 3 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: gandalf
          containers:
            - name: restic
              image: restic/restic:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail

                  # The restic/restic image is minimal Alpine (wget but
                  # no curl). Install curl for SMTP. ~2s, best-effort —
                  # if it fails (network, apk mirror down), send_email
                  # below no-ops and Uptime Kuma push remains the signal.
                  apk add --no-cache curl >/dev/null 2>&1 || true

                  push() {
                    wget -q -O- "${UPTIME_KUMA_PUSH_BACKUP_URL}?status=${1:-up}&msg=${2:-OK}" >/dev/null 2>&1 || true
                  }

                  send_email() {
                    # No-op silently if SMTP env isn't fully populated or
                    # curl isn't available. Both branches happen during
                    # normal operation if reflector hasn't synced yet OR
                    # apk add failed — neither should escalate into a
                    # second failure on top of the original.
                    if [ -z "${SMTP_HOST:-}" ] || [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASS:-}" ]; then
                      return 0
                    fi
                    if ! command -v curl >/dev/null 2>&1; then
                      return 0
                    fi
                    subject="$1"
                    body="$2"
                    {
                      printf 'From: %s\r\n' "$SMTP_FROM"
                      printf 'To: %s\r\n' "$SMTP_TO"
                      printf 'Subject: %s\r\n' "$subject"
                      printf 'Date: %s\r\n' "$(date)"
                      printf 'MIME-Version: 1.0\r\n'
                      printf 'Content-Type: text/plain; charset=UTF-8\r\n'
                      printf '\r\n'
                      printf '%s\r\n' "$body"
                    } | curl -sS --max-time 30 \
                        --url "smtps://${SMTP_HOST}:${SMTP_PORT:-465}" \
                        --user "$SMTP_USER:$SMTP_PASS" \
                        --mail-from "$SMTP_FROM" \
                        --mail-rcpt "$SMTP_TO" \
                        --upload-file - >/dev/null 2>&1 || true
                  }

                  on_failure() {
                    exit_code=$?
                    push down "failed (exit=$exit_code)"
                    # Body built line-by-line via printf so every line
                    # stays within the YAML block scalar's indentation.
                    # \$(...) becomes literal $(...) in the email body
                    # so the recipient can copy-paste a usable command.
                    body=$(printf '%s\n' \
                      "Restic backup CronJob failed on gandalf at $(date)." \
                      "" \
                      "Exit code: $exit_code" \
                      "Job pod:   ${HOSTNAME:-unknown}" \
                      "Schedule:  daily 03:00 ET" \
                      "" \
                      "Inspect via:" \
                      "  kubectl -n backup get jobs" \
                      "  kubectl -n backup logs -l job-name=\$(kubectl -n backup get jobs --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}')" \
                      "" \
                      "This message is sent in addition to the Uptime Kuma push monitor" \
                      "(restic-backup); both fire on the same trap." \
                      "" \
                      "Repo: github.com/nickvigilante/homelab")
                    send_email "[homelab] Restic backup FAILED on gandalf" "$body"
                  }

                  trap on_failure ERR
                  echo "=== Jellyfin config ==="
                  restic backup \
                    --host gandalf \
                    --tag jellyfin-config \
                    /backup/jellyfin
                  echo
                  echo "=== Pi-hole config ==="
                  restic backup \
                    --host gandalf \
                    --tag pihole-config \
                    --exclude='pihole-FTL.db*' \
                    /backup/pihole
                  echo
                  echo "=== Uptime Kuma data ==="
                  restic backup \
                    --host gandalf \
                    --tag uptime-kuma-data \
                    /backup/uptime-kuma
                  echo
                  echo "=== Authentik postgres ==="
                  restic backup \
                    --host gandalf \
                    --tag authentik-postgres \
                    /backup/authentik-postgres
                  echo
                  echo "=== Coder postgres ==="
                  restic backup \
                    --host gandalf \
                    --tag coder-postgres \
                    /backup/coder-postgres
                  echo
                  echo "=== Outline postgres ==="
                  restic backup \
                    --host gandalf \
                    --tag outline-postgres \
                    /backup/outline-postgres
                  echo
                  echo "=== Syncthing data ==="
                  # Excludes Syncthing's database files — they're
                  # the index, which Syncthing rebuilds from the
                  # folder contents on first launch. Including them
                  # would bloat each snapshot for no recovery value
                  # (and the .tmp/.syncthing.* files churn often).
                  restic backup \
                    --host gandalf \
                    --tag syncthing-data \
                    --exclude='index-*.db' \
                    --exclude='**/.stfolder' \
                    --exclude='**/.stversions' \
                    --exclude='**/.syncthing.*.tmp' \
                    --exclude='**/~syncthing~*.tmp' \
                    /backup/syncthing
                  echo
                  echo "=== Snapshot summary ==="
                  restic snapshots --compact
                  push up OK
              envFrom:
                - secretRef:
                    name: restic-credentials
                - secretRef:
                    name: uptime-kuma-push-urls
              env:
                # SMTP relay creds — sourced from `smtp-relay` Secret
                # which emberstack/reflector mirrors here from
                # auth/smtp-relay (the source-of-truth in the auth
                # namespace, kept tight per RBAC blast-radius
                # discipline). dashes-in-keys means we can't envFrom
                # this Secret directly — explicit valueFrom each.
                - name: SMTP_HOST
                  value: "smtp.forwardemail.net"
                - name: SMTP_PORT
                  value: "465"
                # Where alert emails go. Same inbox akadmin recovery
                # already targets. Hardcoded — change here if the
                # homelab admin inbox ever moves.
                - name: SMTP_TO
                  value: "vigihome-admin@vigiemail.com"
                - name: SMTP_USER
                  valueFrom:
                    secretKeyRef:
                      name: smtp-relay
                      key: smtp-username
                - name: SMTP_PASS
                  valueFrom:
                    secretKeyRef:
                      name: smtp-relay
                      key: smtp-password
                # FROM matches USER — Forward Email requires the auth
                # username to match (or be an alias of) the sending
                # address. Same key reused.
                - name: SMTP_FROM
                  valueFrom:
                    secretKeyRef:
                      name: smtp-relay
                      key: smtp-username
              volumeMounts:
                - name: jellyfin-config
                  mountPath: /backup/jellyfin
                  readOnly: true
                - name: pihole-config
                  mountPath: /backup/pihole
                  readOnly: true
                - name: uptime-kuma-data
                  mountPath: /backup/uptime-kuma
                  readOnly: true
                - name: authentik-postgres
                  mountPath: /backup/authentik-postgres
                  readOnly: true
                - name: coder-postgres
                  mountPath: /backup/coder-postgres
                - name: outline-postgres
                  mountPath: /backup/outline-postgres
                  readOnly: true
                - name: syncthing-data
                  mountPath: /backup/syncthing
                  readOnly: true
          volumes:
            - name: jellyfin-config
              hostPath:
                path: /opt/jellyfin/config
                type: Directory
            - name: pihole-config
              hostPath:
                path: /opt/pihole/etc-pihole
                type: Directory
            - name: uptime-kuma-data
              hostPath:
                path: /opt/uptime-kuma/data
                type: Directory
            - name: authentik-postgres
              hostPath:
                path: /opt/authentik/postgres
                type: Directory
            - name: coder-postgres
              hostPath:
                # DirectoryOrCreate so the daily backup doesn't fail
                # while Coder is mid-deployment (the dir is created by
                # the PV bind on first apply, but the CronJob change
                # may land before postgres comes up).
                path: /opt/coder/postgres
                type: DirectoryOrCreate
            - name: outline-postgres
              hostPath:
                # DirectoryOrCreate so the backup doesn't fail if this
                # change lands before the Outline deploy creates the dir.
                path: /opt/outline/postgres
                type: DirectoryOrCreate
            - name: syncthing-data
              hostPath:
                # DirectoryOrCreate for the same reason as coder above
                # — if this CronJob update lands before the Syncthing
                # PV pre-flight (mkdir /mnt/storage/syncthing && chown
                # 1000:1000) has been done, don't fail the whole
                # backup; the dir gets created empty and the snapshot
                # for this tag will be empty until the deploy lands.
                path: /mnt/storage/syncthing
                type: DirectoryOrCreate
