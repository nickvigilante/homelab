# Daily backup CronJob. Reads source dirs via hostPath (read-only) and
# pushes deduplicated snapshots to the restic repo on Storj.
#
# Sources backed up:
#   - /opt/jellyfin/config       (Jellyfin DB + settings)
#   - /opt/pihole/etc-pihole     (Pi-hole config + gravity DB; FTL query DB excluded)
#   - /opt/uptime-kuma/data      (Uptime Kuma SQLite DB + monitor config)
#   - /opt/authentik/postgres    (Authentik PostgreSQL data; useless without AUTHENTIK_SECRET_KEY)
#
# Heartbeat: pings the `restic-backup` push monitor in Uptime Kuma on
# success and on failure (via trap). If the job dies before reaching
# either branch, the monitor goes DOWN on its own when the heartbeat
# interval expires — same signal, slower.
#
# Schedule: 03:00 every day. Adjust via `spec.schedule` if 3am isn't quiet.
#
# Manual trigger (e.g. to test):
#   kubectl -n backup create job --from=cronjob/restic-backup test-backup-$(date +%s)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-backup
  namespace: backup
spec:
  schedule: "0 3 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: gandalf
          containers:
            - name: restic
              image: restic/restic:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  push() {
                    wget -q -O- "${UPTIME_KUMA_PUSH_BACKUP_URL}?status=${1:-up}&msg=${2:-OK}" >/dev/null 2>&1 || true
                  }
                  trap 'push down failed' ERR
                  echo "=== Jellyfin config ==="
                  restic backup \
                    --host gandalf \
                    --tag jellyfin-config \
                    /backup/jellyfin
                  echo
                  echo "=== Pi-hole config ==="
                  restic backup \
                    --host gandalf \
                    --tag pihole-config \
                    --exclude='pihole-FTL.db*' \
                    /backup/pihole
                  echo
                  echo "=== Uptime Kuma data ==="
                  restic backup \
                    --host gandalf \
                    --tag uptime-kuma-data \
                    /backup/uptime-kuma
                  echo
                  echo "=== Authentik postgres ==="
                  restic backup \
                    --host gandalf \
                    --tag authentik-postgres \
                    /backup/authentik-postgres
                  echo
                  echo "=== Snapshot summary ==="
                  restic snapshots --compact
                  push up OK
              envFrom:
                - secretRef:
                    name: restic-credentials
                - secretRef:
                    name: uptime-kuma-push-urls
              volumeMounts:
                - name: jellyfin-config
                  mountPath: /backup/jellyfin
                  readOnly: true
                - name: pihole-config
                  mountPath: /backup/pihole
                  readOnly: true
                - name: uptime-kuma-data
                  mountPath: /backup/uptime-kuma
                  readOnly: true
                - name: authentik-postgres
                  mountPath: /backup/authentik-postgres
                  readOnly: true
          volumes:
            - name: jellyfin-config
              hostPath:
                path: /opt/jellyfin/config
                type: Directory
            - name: pihole-config
              hostPath:
                path: /opt/pihole/etc-pihole
                type: Directory
            - name: uptime-kuma-data
              hostPath:
                path: /opt/uptime-kuma/data
                type: Directory
            - name: authentik-postgres
              hostPath:
                path: /opt/authentik/postgres
                type: Directory
