# TEMPLATE ONLY -- documents the keys in the `homepage-secrets` Secret
# (namespace: homepage). Never applied; the real Secret is produced by
# ESO from BWS via `external-secret.yaml` (#135 Task 8). The keys below
# match the BWS secret names in the `homelab` project; the BW vault
# items remain as DR mirrors. See README.md "Secrets pipeline".
#
# Consumed by Homepage as HOMEPAGE_VAR_* env vars (see values.yaml `env:`),
# which widgets reference as `{{HOMEPAGE_VAR_...}}`.
apiVersion: v1
kind: Secret
metadata:
  name: homepage-secrets
  namespace: homepage
type: Opaque
stringData:
  # OctoPrint API key — Bitwarden item 'Homelab OctoPrint', field 'API key'.
  # Generated in OctoPrint: Settings -> Application Keys (or a user API key).
  # Surfaced as HOMEPAGE_VAR_OCTOPRINT_API_KEY for the octoprint widget.
  octoprint-api-key: REPLACE_WITH_OCTOPRINT_API_KEY
  # Grafana has no entry here: its Homepage tile is a plain link, not a live
  # widget. The widget needs server-admin (GET /api/admin/stats), which Grafana
  # OSS can't scope to a service account. See README "Service widgets" and #155.
