# Homepage Helm values. Chart: jameswynn/homepage v2.1.0 (appVersion v1.2.0).
#
# Why Homepage: k8s-native dashboard at the apex of vigihome.net. First
# end-to-end exercise of the HTTPS-via-vigihome stack (Ingress + reflected
# vigihome-tls + Pi-hole local DNS apex record), and a low-stakes way to
# prove the pattern before migrating existing services with users.
#
# Service list is hand-curated for now. Homepage can auto-discover
# Ingresses annotated with `gethomepage.dev/enabled: "true"`, but
# retro-fitting every existing service's Ingress is out of scope for
# this PR — flip on auto-discovery in a follow-up once we've migrated
# a few services to vigihome.net and their Ingresses are getting
# touched anyway.

image:
  repository: ghcr.io/gethomepage/homepage
  # Pin to the chart's appVersion. Bump when bumping the chart version.
  tag: v1.2.0

# Kubernetes integration (cluster resource widgets, eventual Ingress
# auto-discovery). enableRbac true → chart creates the ClusterRole +
# ClusterRoleBinding that lets the controller list nodes / namespaces /
# pods / services / ingresses. enabling these now means the widget
# block below can use `mode: cluster`.
enableRbac: true
serviceAccount:
  create: true
  name: homepage

# Single-node cluster; pin to gandalf.
nodeSelector:
  kubernetes.io/hostname: gandalf

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

ingress:
  main:
    enabled: true
    ingressClassName: traefik
    annotations:
      # HTTPS-only on 443. No HTTP-on-port-80 entrypoint here — type
      # `https://vigihome.net` explicitly. A http→https redirect via a
      # Traefik middleware can land later if typing https:// gets old.
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
      - host: &host vigihome.net
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - *host
        # vigihome-tls is reflected into this namespace by reflector
        # (annotations on cert-manager's Certificate via secretTemplate).
        secretName: vigihome-tls

# Required as of Homepage v1.x — refuses requests with Host headers
# outside this list. Allow both the public name (when used via Traefik)
# and the in-cluster Service name (for kubectl port-forward / probes).
env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "vigihome.net,homepage.homepage.svc.cluster.local"
  # OctoPrint widget API key — from the homepage-secrets Secret (Bitwarden:
  # 'Homelab OctoPrint' / 'API key'). Referenced by the widget below as
  # {{HOMEPAGE_VAR_OCTOPRINT_API_KEY}}. See README + secret.example.yaml.
  - name: HOMEPAGE_VAR_OCTOPRINT_API_KEY
    valueFrom:
      secretKeyRef:
        name: homepage-secrets
        key: octoprint-api-key
  # Grafana widget creds — a dedicated Viewer-role Grafana login (Homepage's
  # grafana widget uses basic auth, not an API token). From homepage-secrets
  # (Bitwarden 'Homelab Grafana' / homepage-user + homepage-password).
  - name: HOMEPAGE_VAR_GRAFANA_USER
    valueFrom:
      secretKeyRef:
        name: homepage-secrets
        key: grafana-user
  - name: HOMEPAGE_VAR_GRAFANA_PASSWORD
    valueFrom:
      secretKeyRef:
        name: homepage-secrets
        key: grafana-password

config:
  # Hand-curated initial list pointing at current *.home services.
  # As each service migrates to *.vigihome.net in Phase 3 PRs, update
  # the href here in the same PR.
  services:
    - Infrastructure:
        - Pi-hole:
            href: https://pi-hole.vigihome.net/admin
            description: DNS + ad blocking
            icon: pi-hole.png
        - Authentik:
            href: http://authentik.home
            description: SSO / identity
            icon: authentik.png
        - Uptime Kuma:
            href: https://uptime-kuma.vigihome.net
            description: Service health
            icon: uptime-kuma.png
    - Applications:
        - Coder:
            href: https://coder.vigihome.net
            description: Cloud dev environments
            icon: coder.png
        - Jellyfin:
            href: https://jellyfin.vigihome.net
            description: Media server
            icon: jellyfin.png
        - Syncthing:
            href: https://syncthing.vigihome.net
            description: File sync
            icon: syncthing.png
    - 3D Printing:
        - OctoPrint:
            href: https://octoprint.vigihome.net
            description: 3D printer control
            icon: octoprint.png
            # Live widget — hits OctoPrint's API directly (Homepage pod → LAN),
            # not the Ingress. Key injected via HOMEPAGE_VAR_OCTOPRINT_API_KEY
            # (homepage-secrets Secret). See README.
            widget:
              type: octoprint
              url: http://192.168.50.118:5000
              key: "{{HOMEPAGE_VAR_OCTOPRINT_API_KEY}}"
    - Observability:
        - Grafana:
            href: https://grafana.vigihome.net
            description: Dashboards & metrics
            icon: grafana.png
            # Live widget — hits Grafana's in-cluster Service directly (not the
            # Authentik-gated Ingress) using a dedicated Viewer login. Creds via
            # HOMEPAGE_VAR_GRAFANA_USER/PASSWORD (homepage-secrets). See README.
            widget:
              type: grafana
              url: http://kps-grafana.monitoring.svc.cluster.local
              username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"

  widgets:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "k3s"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank

  # `mode: cluster` lets the kubernetes widget read across the cluster
  # via the ServiceAccount's ClusterRole. `disable` would no-op the
  # widget; `default` uses an in-namespace ServiceAccount which is too
  # narrow for the nodes/cluster view we want.
  kubernetes:
    mode: cluster

  # settingsString preserves key ordering (Helm's toYaml sorts keys).
  settingsString: |
    title: vigihome
    headerStyle: boxed
    layout:
      Infrastructure:
        style: row
        columns: 3
      Applications:
        style: row
        columns: 3
      3D Printing:
        style: row
        columns: 3
      Observability:
        style: row
        columns: 3
      Infra & Cloud:
        style: row
        columns: 4
      Productivity:
        style: row
        columns: 4
      Finance:
        style: row
        columns: 4
    theme: dark
    color: slate

  # External SaaS / cloud apps used regularly — a quick-launch dashboard.
  # These are plain link tiles (no Homepage widget exists for them, and the
  # goal here is fast access, not live status). Self-hosted services live in
  # `services` above; their live widgets are tracked in #91. Group keys must
  # match the `layout` entries in settingsString below.
  bookmarks:
    - Infra & Cloud:
        - Cloudflare:
            - icon: cloudflare.png
              href: https://dash.cloudflare.com
        - Storj:
            - icon: storj.png
              href: https://us1.storj.io
        - Forward Email:
            - icon: forwardemail.png
              href: https://forwardemail.net
        - GitHub:
            - icon: github.png
              href: https://github.com
        - Claude:
            - icon: claude.png
              href: https://claude.ai
        - Asus Router:
            - icon: asus.png
              href: http://192.168.50.1/
    - Productivity:
        - Todoist:
            - icon: todoist.png
              href: https://app.todoist.com
        - Raindrop:
            - icon: raindrop.png
              href: https://app.raindrop.io
        - Home Assistant:
            - icon: home-assistant.png
              href: https://home-assistant.vigihome.net
        - Proton Mail:
            - icon: proton-mail.png
              href: https://mail.proton.me
        - Kagi:
            - icon: kagi.png
              href: https://kagi.com
        - Bitwarden:
            - icon: bitwarden.png
              href: https://vault.bitwarden.com
    - Finance:
        - YNAB:
            - abbr: YN
              href: https://app.ynab.com
        - Wealthfront:
            - abbr: WF
              href: https://www.wealthfront.com
        - Fidelity:
            - abbr: FD
              href: https://www.fidelity.com
        - Wells Fargo:
            - abbr: WG
              href: https://www.wellsfargo.com
        - Chase:
            - abbr: CH
              href: https://www.chase.com
        - Capital One:
            - abbr: C1
              href: https://www.capitalone.com
        - Navy Federal:
            - abbr: NF
              href: https://navyfederal.org
  docker:
