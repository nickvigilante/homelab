# ExternalSecret feeding the homepage-secrets k8s Secret from the BWS
# `homelab` project. ESO refreshes from BWS every refreshInterval; the
# k8s Secret keys are whatever Homepage's values.yaml references via
# HOMEPAGE_VAR_* env vars.
#
# Migration note: the Secret was previously created imperatively per
# the k8s/kube-prometheus-stack/README step 7 recipe; this ExternalSecret
# replaces that step. Source-of-truth values live in BWS now (with the
# BW vault items as DR backup, same pattern as Homelab Restic Repository).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-secrets
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: homepage-secrets
    creationPolicy: Owner
  data:
    # `remoteRef.key` for the bitwardensecretsmanager provider is the
    # BWS secret's UUID (names aren't unique within a project, so the
    # provider only accepts IDs). These are identifiers, not secrets --
    # without the bws-access-token they grant nothing. The inline
    # `gitleaks:allow` markers suppress the high-entropy heuristic.
    - secretKey: octoprint-api-key
      remoteRef:
        key: 413ae347-cc2e-43c0-8964-b45a016c6463 # gitleaks:allow
