# ClusterSecretStore wiring ESO to Bitwarden Secrets Manager.
#
# - bitwardenServerSDKURL hits the bitwarden-sdk-server deployed in
#   external-secrets (Task 6). Cluster-internal Service DNS; never goes
#   to the LAN or out.
# - caProvider trusts the internal CA (Task 5) so ESO accepts the
#   sdk-server's cert without a CA bundle inline. The ca.crt key comes
#   from the cert-manager-managed `internal-ca` Secret in cert-manager.
# - auth.secretRef reads the BWS access token from `bws-access-token`
#   in external-secrets (Task 4). The token has read-only access to the
#   single `homelab` project; no write back.
# - organizationID + projectID are non-secret BWS identifiers. They're
#   safe to commit -- without the token, knowing them does nothing.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      organizationID: "9c7135e9-ede9-4b78-9c91-b45900149b66"
      projectID: "c167c5ba-9144-4b04-8a10-b45a01570e69"
      auth:
        secretRef:
          credentials:
            name: bws-access-token
            namespace: external-secrets
            key: token
      caProvider:
        type: Secret
        name: internal-ca
        namespace: cert-manager
        key: ca.crt
