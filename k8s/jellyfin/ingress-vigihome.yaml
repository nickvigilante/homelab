# Additional Ingress for Jellyfin over HTTPS at
# https://jellyfin.vigihome.net. Lives alongside the chart-managed
# multi-host Ingress (jellyfin.home, gandalf.tail395fc0.ts.net,
# vigilan.tube) — those existing hostnames keep working.
#
# Jellyfin's OIDC integration is queued but not yet wired (see
# homelab-todo.md "Authentik downstream integrations queue"), so this
# cutover is non-coordinated. When OIDC lands, the SSO plugin's
# configured issuer URL must match wherever Authentik is serving at
# the time.
#
# DNS prereq (manual, see commit body): Pi-hole local DNS record
# `jellyfin.vigihome.net → 192.168.50.135` via the admin UI before
# applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-vigihome
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jellyfin.vigihome.net
      # Reflected into `media` via cert-manager's secretTemplate
      # annotations on k8s/cert-manager/certificate.yaml.
      secretName: vigihome-tls
  rules:
    - host: jellyfin.vigihome.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
