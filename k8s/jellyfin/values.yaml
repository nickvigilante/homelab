image:
  # Chart's appVersion (10.11.x) is current; let the chart pick it.
  tag: ""

deploymentStrategy:
  # Recreate so the hostPath config dir is never held by two pods at once.
  type: Recreate

service:
  type: ClusterIP
  port: 8096

# Pin to the ThinkCentre — /mnt/vigilantube (FUSE) and /opt/jellyfin/config live here.
nodeSelector:
  kubernetes.io/hostname: gandalf

jellyfin:
  env:
    - name: TZ
      value: America/New_York
    # The canonical URL Jellyfin advertises in self-referential links
    # (DLNA discovery, share links, mobile app server-URL responses).
    # Consolidated onto the vigihome TLS host; supersedes the prior
    # http://vigilan.tube value, which is dropped along with the rest
    # of the legacy chart-Ingress hostnames.
    - name: JELLYFIN_PublishedServerUrl
      value: "https://jellyfin.vigihome.net"

persistence:
  config:
    enabled: true
    # Reuses /opt/jellyfin/config from the raw-YAML deployment via a PV+PVC
    # defined in pv-pvc.yaml. Preserves Jellyfin's DB, library config, etc.
    existingClaim: jellyfin-config
  media:
    enabled: true
    type: hostPath
    hostPath: /mnt/vigilantube
  cache:
    # Cache is transcoding scratch space — emptyDir is fine, regenerated on demand.
    enabled: false

# Chart-managed Ingress for https://jellyfin.vigihome.net. Consolidates
# Jellyfin onto a single TLS host: the previous chart Ingress carried
# three plain-HTTP hostnames (jellyfin.home, the tailnet MagicDNS name,
# and vigilan.tube), plus a raw ingress-vigihome.yaml added the HTTPS
# host. All four collapse into this one chart Ingress.
#
# Off-LAN access is unaffected: jellyfin.vigihome.net resolves to
# gandalf's tailnet IP via Pi-hole's `address=/vigihome.net/...`
# wildcard, so tailnet clients (cellular MacBook, iPhone, etc.) reach
# Jellyfin the same way they reach every other vigihome service.
#
# Any client that had vigilan.tube saved as its server URL (mobile
# app, Cast target, family bookmarks) needs to be re-pointed to
# https://jellyfin.vigihome.net.
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: jellyfin.vigihome.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - jellyfin.vigihome.net
      # Reflected into the `media` namespace by emberstack/reflector
      # via cert-manager's secretTemplate annotations on
      # k8s/cert-manager/certificate.yaml.
      secretName: vigihome-tls
