# TEMPLATE ONLY — documents the keys in the `syncstorage-rs-secrets` Secret.
# Never applied; the real Secret is generated by ESO from BWS entries (see
# README.md "One-time setup"). Secrets never enter this public repo.
apiVersion: v1
kind: Secret
metadata:
  name: syncstorage-rs-secrets
  namespace: syncstorage-rs
type: Opaque
stringData:
  # Generated: openssl rand -hex 32 (two distinct values)
  master-secret: REPLACE_WITH_MASTER_SECRET
  fxa-metrics-hash-secret: REPLACE_WITH_FXA_METRICS_HASH_SECRET
  # Postgres credentials (generated). Consumed by the bitnami chart via
  # existingSecret, and folded into the two database-url keys below.
  postgres-password: REPLACE_WITH_PG_PASSWORD
  postgres-superuser-password: REPLACE_WITH_PG_SUPERUSER_PASSWORD
  # Full connection strings syncstorage-rs reads (embed postgres-password):
  # postgres://syncstorage:<postgres-password>@postgres-postgresql.syncstorage-rs.svc.cluster.local:5432/syncstorage
  # postgres://syncstorage:<postgres-password>@postgres-postgresql.syncstorage-rs.svc.cluster.local:5432/tokenserver
  syncstorage-database-url: REPLACE_WITH_SYNCSTORAGE_DATABASE_URL
  tokenserver-database-url: REPLACE_WITH_TOKENSERVER_DATABASE_URL
