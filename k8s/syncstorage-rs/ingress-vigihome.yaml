# HTTPS Ingress for syncstorage-rs at https://firefox-sync.vigihome.net.
# Traefik terminates TLS on websecure (443) and proxies plain HTTP to
# the syncstorage-rs Service on 8000. vigihome-tls is reflected into the
# syncstorage-rs namespace by emberstack/reflector (see certificate.yaml).
# DNS: the Pi-hole *.vigihome.net wildcard already resolves this host.
#
# Tailscale-only by design (see README) -- nothing about this Ingress
# enforces that; it's reachable to anything that can resolve and route
# to *.vigihome.net, which today is only the tailnet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: syncstorage-rs-vigihome
  namespace: syncstorage-rs
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - firefox-sync.vigihome.net
      secretName: vigihome-tls
  rules:
    - host: firefox-sync.vigihome.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: syncstorage-rs
                port:
                  number: 8000
