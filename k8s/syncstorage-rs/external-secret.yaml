# syncstorage-rs-secrets sourced from BWS. Four keys total:
#
#   - master-secret -- generated `openssl rand -hex 32`; Hawk signing key,
#     the server cannot authenticate requests without it.
#   - fxa-metrics-hash-secret -- generated `openssl rand -hex 32`; hashes
#     users' metrics UIDs so they stay anonymous.
#   - postgres-password, postgres-superuser-password -- bitnami chart
#     existingSecret consumes these via secretKeys in postgres-helmrelease.yaml
#   - syncstorage-database-url, tokenserver-database-url -- SYNTHESIZED via
#     target.template from postgres-password + the hardcoded in-cluster
#     postgres hostname; not stored separately in BWS so password rotations
#     don't require a second BWS edit (same pattern as k8s/outline).
#
# mergePolicy: Merge passes through all fetched keys unchanged; the
# template block ONLY adds the two database-url keys. Without Merge, only
# keys named in the template would land in the in-cluster Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: syncstorage-rs-secrets
  namespace: syncstorage-rs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: syncstorage-rs-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        # Kebab-case secretKeys must be accessed via `index . "..."` --
        # Go templates can't parse `.postgres-password` as a field path.
        syncstorage-database-url: postgres://syncstorage:{{ index . "postgres-password" }}@postgres-postgresql.syncstorage-rs.svc.cluster.local:5432/syncstorage
        tokenserver-database-url: postgres://syncstorage:{{ index . "postgres-password" }}@postgres-postgresql.syncstorage-rs.svc.cluster.local:5432/tokenserver
  data:
    - secretKey: master-secret
      remoteRef:
        key: 95224ef8-a36a-4d68-b671-b4d2014a82f8 # gitleaks:allow
    - secretKey: fxa-metrics-hash-secret
      remoteRef:
        key: 224a8ae6-0eac-472c-82ad-b4d2014a880a # gitleaks:allow
    - secretKey: postgres-password
      remoteRef:
        key: a4beaee8-3dd2-49e7-bc42-b4d2014a8d4e # gitleaks:allow
    - secretKey: postgres-superuser-password
      remoteRef:
        key: 40af75bc-05da-4ea3-88fd-b4d2014a923b # gitleaks:allow
